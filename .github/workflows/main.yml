name: Run YouTube Subtitle Pipeline

on:
  # 毎日 深夜2時（JST）に自動実行（UTC 17:00）下の2個コメント解除で自動実行
  #schedule:
  #  - cron: '0 5 * * *'
  workflow_dispatch: # 手動実行ボタンを有効化

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install google-genai youtube-transcript-api yt-dlp pythainlp python-dotenv

      - name: パイプラインの実行
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          python 00_fetch_urls.py

      - name: 生成されたJSONデータを自動コミット＆プッシュ
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/ videos.json pipeline_status.json
          git diff --staged --quiet || git commit -m "Auto: Update subtitle JSONs"
          git push