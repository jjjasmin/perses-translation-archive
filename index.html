<body class="mode-2col-a">

  <div class="container" id="app-container">
    <div class="header-area">
      <div class="header-title-container">
        <h1><a href="index.html">PERSES翻訳pocket</a></h1>
        <div class="site-info">
          <span data-i18n="header_sub">PERSES 日本語翻訳ファンサイト（非公式）</span>
          <span>Managed by <a href="https://x.com/2chicken4you" target="_blank" rel="noopener noreferrer">ming@2chicken4you</a></span>
        </div>
      </div>


      <!-- 言語選択ドロップダウン -->
      <div class="lang-selector-container">
        <label for="langSelect">Language: </label>
        <select id="langSelect" onchange="changeLanguage(this.value)">
          <option value="ja" selected>日本語 (JA)</option>
          <option value="en">English (EN)</option>
          <option value="ko">한국어 (KO)</option>
          <option value="zh-TW">繁體中文 (zh-TW)</option>
          <option value="id">Bahasa Indonesia (ID)</option>
          <option value="pt">Português (PT)</option>
          <!-- 今後 th や zh などが増えた場合も option を追加するだけで対応可能 -->
        </select>
      </div>
      <div class="layout-buttons">
        <button type="button" class="pink-btn" id="jump-to-search-btn" onclick="scrollToSearch()">🔍</button>

        <button class="pink-btn theme-btn" id="theme-toggle-btn" title="ダークモード切替" data-i18n-title="title_theme">
          <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12.3 2a10 10 0 0 0 9.7 12.3 10 10 0 1 1-9.7-12.3z"/>
          </svg>
        </button>
        <!-- ★ X（旧Twitter）シェアボタン -->
        <button class="pink-btn" id="x-share-btn" title="X(Twitter)でこの動画をシェア" data-i18n-title="title_share">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
        </button>

        <!-- ★ URLコピーボタン -->
        <button class="pink-btn" id="copy-url-btn" title="動画のURLをコピー" data-i18n-title="title_copy">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path fill-rule="evenodd" d="M10.854 7.146a.5.5 0 0 1 0 .708l-3 3a.5.5 0 0 1-.708 0l-1.5-1.5a.5.5 0 1 1 .708-.708L7.5 9.793l2.646-2.647a.5.5 0 0 1 .708 0z"/>
            <path d="M4 1.5H3a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-1H4a1 1 0 0 1-1-1V1.5z"/>
            <path d="M5 1.5A1.5 1.5 0 0 1 6.5 0h7A1.5 1.5 0 0 1 15 1.5v9A1.5 1.5 0 0 1 13.5 12h-7A1.5 1.5 0 0 1 5 10.5v-9zM6.5 1h7a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-7a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5z"/>
          </svg>
        </button>

        <!-- 1カラム -->
        <button class="layout-btn" data-mode="1col" title="1カラム（全幅動画）">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor">
            <rect x="2" y="2" width="12" height="7" rx="1" opacity="0.6"/> <!-- 動画エリア -->
            <path d="M7 4.5l3 1.5-3 1.5v-3z" /> <!-- 再生マーク -->
            <rect x="2" y="10" width="12" height="4" rx="1" /> <!-- 字幕/コンテンツ -->
          </svg>
        </button>
      
        <!-- 2カラムA -->
        <button class="layout-btn active" data-mode="2col-a" title="2カラムA（左：動画/字幕、右：関連動画）">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor">
            <!-- 左カラム（広め）：動画（上）と字幕（下） -->
            <rect x="1" y="2" width="9" height="5" rx="1" opacity="0.6"/> <!-- 動画 -->
            <path d="M4.5 3.5l3 1.5-3 1.5v-3z" /> <!-- 再生マーク -->
            <rect x="1" y="8" width="9" height="6" rx="1" /> <!-- 字幕（メモ帳風） -->
            <line x1="3" y1="10" x2="8" y2="10" stroke="white" stroke-width="0.8" stroke-linecap="round"/>
            <line x1="3" y1="12" x2="6" y2="12" stroke="white" stroke-width="0.8" stroke-linecap="round"/>
            
            <!-- 右カラム（狭め）：関連動画（リスト） -->
            <rect x="11" y="2" width="4" height="2" rx="0.5"/>
            <rect x="11" y="5" width="4" height="2" rx="0.5"/>
            <rect x="11" y="8" width="4" height="2" rx="0.5"/>
            <rect x="11" y="11" width="4" height="2" rx="0.5"/>
          </svg>
        </button>
      
        <!-- 2カラムB -->
        <button class="layout-btn" data-mode="2col-b" title="2カラムB（左：動画/関連動画、右：字幕）">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor">
            <!-- 左カラム：動画（上）と関連動画（下） -->
            <rect x="1" y="2" width="6.5" height="4" rx="1" opacity="0.6"/> <!-- 動画 -->
            <path x="3" d="M3.5 3.5l2 1-2 1v-2z" /> <!-- 再生マーク（小さめ） -->
            <rect x="1" y="7" width="6.5" height="2" rx="0.5"/> <!-- リスト -->
            <rect x="1" y="10" width="6.5" height="2" rx="0.5"/> <!-- リスト -->
            
            <!-- 右カラム：字幕（広め） -->
            <rect x="8.5" y="2" width="6.5" height="12" rx="1" /> <!-- 字幕 -->
            <line x1="10.5" y1="5" x2="13.5" y2="5" stroke="white" stroke-width="1" stroke-linecap="round"/>
            <line x1="10.5" y1="8" x2="13.5" y2="8" stroke="white" stroke-width="1" stroke-linecap="round"/>
            <line x1="10.5" y1="11" x2="12.5" y2="11" stroke="white" stroke-width="1" stroke-linecap="round"/>
          </svg>
        </button>
            
        <!-- ★ コマ送り・微調整フローティングボタン群 -->
        <div class="frame-seek-controls">
            <!-- シアターモード -->
          <button class="pink-btn" data-mode="fullscreen" title="シアターモード（動画最大化）">
            <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor">
              <path d="M0 3.5A1.5 1.5 0 0 1 1.5 2h13A1.5 1.5 0 0 1 16 3.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 0 12.5v-9zM1.5 3a.5.5 0 0 0-.5.5v9a.5.5 0 0 0 .5.5h13a.5.5 0 0 0 .5-.5v-9a.5.5 0 0 0-.5-.5h-13z"/>
              <path d="M6.5 5.5l4 2.5-4 2.5v-5z"/>
            </svg>
          </button>
          <!-- ★ 字幕コントロールボタン -->
          <!-- 1. 字幕表示/非表示切替（目） -->
          <button type="button" class="sub-ctrl-btn" id="seek-sub-toggle-btn" title="字幕表示/非表示切替">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>

          <!-- 2. 文字サイズ変更（大小のA） -->
          <button type="button" class="sub-ctrl-btn" id="seek-sub-size-btn" title="文字サイズ変更（極々小/極小/小/中/大/極大）">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 19 8.5 6 14 19"/>
              <path d="M5 14h7"/>
              <path d="M17 19l2.5-6 2.5 6"/>
              <path d="M18 17h3"/>
            </svg>
          </button>

          <!-- 3. 字幕デザイン切替（パレット） -->
          <button type="button" class="sub-ctrl-btn" id="seek-sub-style-btn" title="字幕デザイン切替">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/>
              <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/>
              <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/>
              <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/>
              <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.92 0 1.7-.72 1.7-1.61 0-.43-.17-.83-.44-1.12-.27-.29-.44-.69-.44-1.14 0-.89.72-1.61 1.61-1.61H16c3.31 0 6-2.69 6-6 0-5.52-4.5-9.5-10-9.5Z"/>
            </svg>
          </button>

          <!-- ★ シーク・フレーム操作ボタン -->
          <!-- 4. 10秒戻る（反時計回り矢印+10） -->
          <button type="button" class="frame-seek-btn" id="seek-prev10-btn" title="10秒戻る">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
              <text x="12" y="15" font-size="8" font-weight="bold" text-anchor="middle" fill="currentColor" stroke="none">10</text>
            </svg>
          </button>

          <!-- 1フレーム戻る（左矢印 + 1f） -->
          <button type="button" class="frame-seek-btn" id="seek-prev-btn" title="約1フレーム戻る（0.05秒）">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18l-6-6 6-6"/>
              <text x="16" y="15" font-size="9" font-weight="bold" text-anchor="middle" fill="currentColor" stroke="none">1f</text>
            </svg>
          </button>

          <!-- 6. 再生 / 一時停止 -->
          <button type="button" class="frame-seek-btn" id="seek-play-pause-btn" title="再生 / 一時停止">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5,3 14,12 5,21"/>
              <rect x="15" y="4" width="3" height="16"/>
            </svg>
          </button>

          <!-- 1フレーム進む（右矢印 + 1f） -->
          <button type="button" class="frame-seek-btn" id="seek-next-btn" title="約1フレーム進む（0.05秒）">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 6l6 6-6 6"/>
              <text x="8" y="15" font-size="9" font-weight="bold" text-anchor="middle" fill="currentColor" stroke="none">1f</text>
            </svg>
          </button>

          <!-- 8. 10秒進む（時計回り矢印+10） -->
          <button type="button" class="frame-seek-btn" id="seek-next10-btn" title="10秒進む">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
              <path d="M21 3v5h-5"/>
              <text x="12" y="15" font-size="8" font-weight="bold" text-anchor="middle" fill="currentColor" stroke="none">10</text>
            </svg>
          </button>

          <button type="button" class="pink-btn" id="screen-record-btn" onclick="toggleScreenRecord(event)" title="画面録画を開始/停止" data-i18n-title="title_record">
            🎥
          </button>
        </div>
      </div>
    </div>

    <div class="content-layout">
      <div class="main-content">
        <div class="video-section">
          <div class="iframe-wrapper">
            <div id="youtube-player"></div>
            <button class="fullscreen-btn" data-mode="fullscreen">全画面表示</button>
            <button id="exit-fullscreen-btn" class="exit-fullscreen-btn">戻る</button>

            <div id="overlay-subtitle-container" class="overlay-subtitle-container">
              <!-- 字幕コントロールバー（常に操作可能） -->
              <div class="subtitle-controls">
                <button type="button" class="sub-ctrl-btn" id="sub-toggle-btn" title="字幕表示/非表示切替">👁️</button>
                <button type="button" class="sub-ctrl-btn" id="sub-size-btn" title="文字サイズ変更（極々小/極小/小/中/大/極大）">A</button>
                <button type="button" class="sub-ctrl-btn" id="sub-style-btn" title="字幕デザイン切替">🎨</button>
              </div>

              <div id="overlay-subtitle-box" class="overlay-subtitle-box align-center size-medium style-default">
                <span id="overlay-speaker" class="overlay-speaker"></span>
                <span id="overlay-text" class="overlay-text"></span>
              </div>
            </div>
          </div>

          <div id="no-permission-container" style="display: none; padding: 35px 20px; text-align: center; background-color: var(--bg-card, #f8f9fa); border-radius: 12px; border: 1px dashed #ccc; margin-bottom: 15px;">
            <p data-i18n="noPermissionNotice" style="margin-bottom: 14px; font-weight: bold; color: var(--text-secondary, #666); line-height: 1.5;">

            </p>
            <a id="external-video-link" href="#" target="_blank" rel="noopener noreferrer" style="display: inline-block; padding: 10px 22px; background-color: #ff7597; color: #fff; text-decoration: none; border-radius: 20px; font-weight: bold; transition: opacity 0.2s;">
              <span data-i18n="watchOnYoutube">🎬 YouTubeで見る</span>
            </a>
          </div>
        </div>

        <div id="transcript-section" class="transcript-section">
          <div id="transcript-container" class="transcript-list">
            <p style="text-align: center; color: #888;" data-i18n="select_video_msg">動画を選択すると字幕が表示されます。</p>
          </div>
        </div>
      </div>

      <div class="sidebar-section">
        <div id="video-list-section" class="video-list-section">
          <div class="video-list-title">
            <div class="search-wrapper" id="search-wrapper">
              

              <!-- 検索窓とボタン -->
              <button type="button" id="tag-toggle-btn" class="search-btn" style="background-color: #eef2f5; color: #007bff; border: 1px solid #d0e1f9; font-weight: bold;"><span data-i18n="tag_btn">🏷️ タグ</span></button>
              <input type="text" id="search-input" class="search-input" placeholder="検索ワード・タグ..." data-i18n-placeholder="search_ph" autocomplete="off">
              <span id="search-clear-btn" class="search-clear-btn" title="クリア">×</span>
              <button type="button" id="search-btn" class="search-btn" data-i18n="search_btn">検索</button>
              <button type="button" id="sort-order-btn" class="search-btn" style="background-color: #6c757d; margin-left: 2px;" title="投稿日で並べ替え">
                  <span id="sort-order-label">new⬇</span>
              </button>
              <div id="keyword-floating-box" class="keyword-floating-box"></div>
            </div><!-- ★ 追加: 選択されたタグが表示されるエリア -->
              <div id="active-tags-container" class="active-tags-container"></div>
          </div>
          <div id="video-list-container" class="video-grid"></div>
        </div>
      </div>
    </div>

    /**

    function updateStaticUI(lang = currentLang) {
      // テキストの更新 [data-i18n]
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (uiDict[key]) {
          el.textContent = uiDict[key][lang] || uiDict[key]['en'] || uiDict[key]['ja'];
        }
      });

      // プレースホルダーの更新 [data-i18n-placeholder]
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.dataset.i18nPlaceholder;
        if (uiDict[key]) {
          el.placeholder = uiDict[key][lang] || uiDict[key]['en'] || uiDict[key]['ja'];
        }
      });

      // ツールチップ(title)の更新 [data-i18n-title]
      document.querySelectorAll('[data-i18n-title]').forEach(el => {
        const key = el.dataset.i18nTitle;
        if (uiDict[key]) {
          el.title = uiDict[key][lang] || uiDict[key]['en'] || uiDict[key]['ja'];

/**
 * 多言語オブジェクトまたは文字列から指定言語のテキストを取得する関数
 * @param {Object|string} target - title や translation 等のプロパティ
 * @param {string} lang - 取得したい言語コード (デフォルト: currentLang)
 * @returns {string}
 */
function getI18nText(target, lang = currentLang) {
  if (!target) return '';
  // targetが単なる文字列の場合（古いデータ構造などの互換性維持）
  if (typeof target === 'string') return target;
  // オブジェクトの場合：指定言語 -> 日本語 -> オブジェクト内の最初の値 -> 空文字 の順でフォールバック
  return target[lang] || target['ja'] || Object.values(target)[0] || '';
}

/**
 * 言語変更時のイベントハンドラ
 */
function changeLanguage(newLang) {
  currentLang = newLang;
  localStorage.setItem('user_lang', newLang);

  // ★ 追加：固定UIの文字列を変更後の言語に更新
  updateStaticUI(currentLang);

  // 1. 変更前の選択中インデックスを保持
  const savedIndex = currentVideoIndex;

  // 2. 動画リストの描画（HTML）だけを再構築
  if (typeof videoListContainer !== 'undefined' && videoListContainer) {
    videoListContainer.innerHTML = '';
    loadedCount = 0;
    if (typeof loadMoreVideos === 'function') {
      loadMoreVideos();
    }
  }

  // 3. インデックスを復元し、現在選択中の動画カードに active クラスを再付与
  currentVideoIndex = savedIndex;
  const items = videoListContainer ? videoListContainer.querySelectorAll('.video-item') : [];
  items.forEach(item => {
    if (parseInt(item.dataset.index, 10) === currentVideoIndex) {
      item.classList.add('active');
    } else {
      item.classList.remove('active');
    }
  });

  // 4. 現在の動画データを安全に取得
  const currentVideo = (filteredVideos && currentVideoIndex >= 0 && currentVideoIndex < filteredVideos.length)
    ? filteredVideos[currentVideoIndex]
    : null;

  // 5. 字幕リストおよび動画概要欄（video-description-box）の再描画
  if (typeof renderTranscript === 'function' && transcriptData && transcriptData.length > 0) {
    let videoDescription = '';

    if (currentVideo) {
      const formattedKeywords = Array.isArray(currentVideo.keywords)
        ? currentVideo.keywords.join(' ')
        : (currentVideo.keywords || '');

      videoDescription = [
        `${currentVideo.published_at || ''}`,
        `${getI18nText(currentVideo.title)}`,
        `${currentVideo.original_title || ''}`,
        `${formattedKeywords}`
      ].join('\n');
    }

    renderTranscript(transcriptData, videoDescription);
  }

  // 6. オーバーレイ字幕の更新
  if (typeof updateActiveTranscript === 'function') {
    updateActiveTranscript();
  }

  // 7. タイトル要素等がある場合の更新
  if (currentVideo) {
    const titleEl = document.querySelector('.current-video-title');
    if (titleEl) {
      titleEl.textContent = getI18nText(currentVideo.title);
    }
  }
}


// タグの追加
function addTag(tag) {
  const trimmed = tag.trim();
  if (!trimmed) return;
  if (!selectedTags.includes(trimmed)) {
    selectedTags.push(trimmed);
    renderActiveTags();
    executeSearch();
  }
}

// タグの削除
function removeTag(tag) {
  selectedTags = selectedTags.filter(t => t !== tag);
  renderActiveTags();
  executeSearch();
}

// 選択中タグの描画関数
function renderActiveTags() {
  const container = document.getElementById('active-tags-container');
  if (!container) return;
  container.innerHTML = '';

  selectedTags.forEach(tag => {
    const chip = document.createElement('span');
    chip.className = 'selected-tag-chip';
    chip.textContent = tag;

    const removeBtn = document.createElement('span');
    removeBtn.className = 'selected-tag-remove';
    removeBtn.innerHTML = '&times;';
    removeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      removeTag(tag);
    });

    chip.appendChild(removeBtn);
    container.appendChild(chip);
  });
}

// AND検索フィルター処理
function filterVideos() {
  const textInput = searchInput ? searchInput.value.trim().toLowerCase() : '';
  const videoItems = document.querySelectorAll('.video-item');

  videoItems.forEach(item => {
    // 動画タイトルとキーワードを取得
    const title = item.querySelector('.video-title')?.textContent.toLowerCase() || '';
    const keywordsText = item.querySelector('.video-keywords')?.textContent.toLowerCase() || '';
    
    // 対象テキスト全体
    const combinedText = title + ' ' + keywordsText;

    // 1. 選択されたすべてのタグが含まれているかチェック (AND条件)
    const matchesTags = selectedTags.every(tag => 
      combinedText.includes(tag.toLowerCase())
    );

    // 2. 入力欄に入力中のテキストも含まれているかチェック
    const matchesInput = !textInput || combinedText.includes(textInput);

    // 両方を満たす場合のみ表示
    if (matchesTags && matchesInput) {
      item.style.display = 'flex';
    } else {
      item.style.display = 'none';
    }
  });
}

    async function setLayoutMode(mode) {
      if (mode === currentLayoutMode) return;

      if (currentLayoutMode !== 'fullscreen') {
        previousLayoutMode = currentLayoutMode;
      }

      document.body.classList.remove('mode-1col', 'mode-2col-a', 'mode-2col-b', 'mode-fullscreen');
      
      if (mode === 'fullscreen') {
        document.body.classList.add('mode-fullscreen');
        // ★ フルスクリーン時は「字幕表示 (ON)」にする
        updateSubtitleVisibility(true);


        // ★ 1. ブラウザ自体を全画面化
        const docElm = document.documentElement;
        try {
          if (docElm.requestFullscreen) {
            await docElm.requestFullscreen();
          } else if (docElm.webkitRequestFullscreen) { /* Safari */
            await docElm.webkitRequestFullscreen();
          }

          // ★ 2. #SHORT キーワードを持たない「横長動画」のみ横画面に固定
          if (screen.orientation && screen.orientation.lock) {
            const currentVideo = filteredVideos[currentVideoIndex];
            
            // keywords 配列に "#SHORT" または "SHORT" が含まれているか判定
            const isShort = currentVideo && Array.isArray(currentVideo.keywords) && 
              currentVideo.keywords.some(kw => kw.toUpperCase().includes('SHORT'));

            // Shorts（縦型）ではない場合のみ横画面（landscape）にロック
            if (!isShort) {
              await screen.orientation.lock('landscape').catch(() => {});
            }
          }
        } catch (err) {
          console.log('フルスクリーン実行エラー:', err);
        }

      } else {
        document.body.classList.add(`mode-${mode}`);

        // ★ 3. 全画面解除時に画面ロックを解除
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
        }

        if (document.fullscreenElement || document.webkitFullscreenElement) {
          if (document.exitFullscreen) {
            document.exitFullscreen().catch(() => {});
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
        }
      }

      currentLayoutMode = mode;
      updateActiveButton(mode);
    }

          btn.classList.add('active');

        if (currentSortOrder === 'desc') {
          return dateB.localeCompare(dateA); // 新しい順 (降順)
        } else {

    function onYouTubeIframeAPIReady() {
      isApiReady = true;
      if (pendingVideoId) {
        initPlayer(pendingVideoId);
      }
    }

    function initPlayer(videoId) {
      if (!isApiReady) {
        pendingVideoId = videoId;
        return;
      }

      if (player) {
        player.loadVideoById({ videoId: videoId });
      } else {
        player = new YT.Player('youtube-player', {
          videoId: videoId,
          playerVars: {
            'autoplay': 0,　//自動再生しない
            'mute': 0,　//ミュートしない
            'playsinline': 1, //強制的に全画面表示（フルスクリーン）にしない
            'cc_load_policy': 0 //字幕表示しない
          },
          events: {
            'onStateChange': onPlayerStateChange
          }
        });
      }
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        startSync();
      } else {
        stopSync();
      }

      if (event.data === YT.PlayerState.ENDED) {
        playNextVideo();
      }
    }

    function playNextVideo() {
      if (currentVideoIndex + 1 < filteredVideos.length) {
        const nextIndex = currentVideoIndex + 1;
        if (nextIndex >= loadedCount) {
          loadMoreVideos();
        }
        const nextVideo = filteredVideos[nextIndex];
        selectVideoByIndex(nextIndex, nextVideo.file, nextVideo.id);
      }
    }

    function startSync() {
      stopSync();
      syncInterval = setInterval(updateActiveTranscript, 250);
    }

    function stopSync() {
      if (syncInterval) {
        clearInterval(syncInterval);
        syncInterval = null;
      }
    }

    function updateActiveTranscript() {
      if (!player || typeof player.getCurrentTime !== 'function' || transcriptData.length === 0) return;

      const currentTime = player.getCurrentTime();

      // ★ 変更点1: start と end の範囲内にあるデータを探す
      let currentIndex = -1;
      for (let i = 0; i < transcriptData.length; i++) {
        const itemStart = parseFloat(transcriptData[i].start || 0);
        // end が未設定の場合は次の start をフォールバック値として使用
        const nextStart = (i < transcriptData.length - 1) ? parseFloat(transcriptData[i + 1].start) : Infinity;
        const itemEnd = transcriptData[i].end !== undefined ? parseFloat(transcriptData[i].end) : nextStart;

        if (currentTime >= itemStart && currentTime <= itemEnd) {
          currentIndex = i;
          break;
        }
      }

      // アクティブな字幕インデックスが切り替わった場合のみUIを更新
      if (currentIndex !== activeIndex) {
        activeIndex = currentIndex;

        const cards = transcriptContainer.querySelectorAll('.transcript-card');
        cards.forEach((card, index) => {
          if (index === activeIndex) {
            card.classList.add('active');

            transcriptSection.scrollTo({
              top: card.offsetTop - transcriptContainer.offsetTop,
              behavior: 'instant'
            });
          } else {
            card.classList.remove('active');
          }
        });

        // ★ 変更点2: 有効な字幕（範囲内）がある場合のみオーバーレイ字幕を表示し、無音区間（-1）では消す
        if (activeIndex !== -1) {
          const currentData = transcriptData[activeIndex];
          const translationText = currentData?.translations ? getI18nText(currentData.translations) : currentData?.translation;
          if (currentData && translationText) {
            if (currentData.speaker) {
              overlaySpeaker.textContent = `[ ${currentData.speaker} ]`;
              overlaySpeaker.style.display = 'inline';
            } else {
              overlaySpeaker.textContent = '';
              overlaySpeaker.style.display = 'none';
            }
            overlayText.textContent = translationText;
            overlaySubtitleBox.style.display = 'block';
          } else {
            overlayText.textContent = '';
            overlaySpeaker.textContent = '';
            overlaySubtitleBox.style.display = 'none';
          }
        } else {
          // 該当する字幕がない時間帯（発言がない無音区間など）は字幕を非表示にする
          overlayText.textContent = '';
          overlaySpeaker.textContent = '';
          overlaySubtitleBox.style.display = 'none';
        }
      }
    }

    function init() {
          // tags.json, videos.json, pipeline_status.json を並行取得
          Promise.all([
            fetch('data/tags.json').then(res => res.ok ? res.json() : {}),
            fetch('data/videos.json').then(res => res.ok ? res.json() : []),
            fetch('pipeline_status.json').then(res => res.ok ? res.json() : {})
          ])
          .then(([tagsData, videoList, statusData]) => {
            if (!videoList || videoList.length === 0) return;

            // ★ pipeline_status.json の情報を videos.json のデータに結合
            videoList = videoList.map(video => {
              const statusObj = statusData[video.id] || {};
              const langStatus = statusObj.status ? getI18nText(statusObj.status) : {};
              return {
                  ...video,
                  mode: langStatus.mode || statusObj.mode || video.mode,
                  words_built: statusObj.words_built || video.words_built
                };
              });

            // ★ 追加: published_at の降順（新しい順）にソート
            videoList.sort((a, b) => {
              const dateA = a.published_at || '';
              const dateB = b.published_at || '';
              return dateB.localeCompare(dateA); // 降順比較
            });

            allVideos = videoList;
            // ★ 変更: 初期検索・表示時に #HIDDEN タグを持つ動画を除外する
            filteredVideos = allVideos.filter(video => {
              if (!Array.isArray(video.keywords)) return true;
              return !video.keywords.some(kw => kw.toUpperCase() === '#HIDDEN');
            });

            sortVideos();

            // tags.json を元にキーワードチップを構築（データ順を保持）
            setupKeywordsFloatingBox(tagsData);
            setupSearchEvents();
            setupSortEvent();

            resetVideoListDisplay();

            // URLパラメータ (?v=...) から動画IDを取得
            const urlParams = new URLSearchParams(window.location.search);
            const initialVideoId = urlParams.get('v');

            let targetIndex = 0;
            if (initialVideoId) {
              const foundIndex = filteredVideos.findIndex(v => v.id === initialVideoId || v.file === initialVideoId);
              if (foundIndex !== -1) {
                targetIndex = foundIndex;
              }
            }

            selectVideoByIndex(targetIndex, filteredVideos[targetIndex].file, filteredVideos[targetIndex].id, false, false);
            setupScrollListener();
          })
          .catch(error => {
            console.error('初期化エラー:', error);
          });
        }

      function setupSortEvent() {
            if (!sortOrderBtn) return;

            sortOrderBtn.addEventListener('click', () => {
              // 'desc' (新しい順) <-> 'asc' (古い順) をトグル切替
              if (currentSortOrder === 'desc') {
                currentSortOrder = 'asc';
                sortOrderLabel.textContent = 'old⬆';
              } else {
                currentSortOrder = 'desc';
                sortOrderLabel.textContent = 'new⬇';
              }

              // 並べ替えて一覧を再表示
              sortVideos();
              resetVideoListDisplay();
            });
          }

          function setupKeywordsFloatingBox(tagsData) {
            let html = '';

            for (const [categoryName, categoryTags] of Object.entries(tagsData)) {
              html += `<div class="keyword-category-title" style="font-size:0.7rem; color:#888; font-weight:bold; width:100%; margin-top:6px; margin-bottom:2px;">${escapeHtml(categoryName)}</div>`;
              
              for (const tagKey of Object.keys(categoryTags)) {
                html += `<span class="keyword-chip" data-keyword="${escapeHtml(tagKey)}">${escapeHtml(tagKey)}</span>`;
              }
            }

            keywordFloatingBox.innerHTML = html;

            // 該当のイベントリスナー部分を修正
            keywordFloatingBox.querySelectorAll('.keyword-chip').forEach(chip => {
              chip.addEventListener('click', (e) => {
                e.stopPropagation();
                const targetKw = chip.dataset.keyword;
                
                // 入力欄上書きではなくタグ追加を実行
                addTag(targetKw);
                searchInput.value = '';

                if (searchClearBtn) {
                  searchClearBtn.style.display = 'block';
                }

                keywordFloatingBox.classList.remove('show');
              });
            });
          }

      function setupSearchEvents() {
        const tagToggleBtn = document.getElementById('tag-toggle-btn');

        // ★ 変更: 検索窓へのフォーカス時はタグ一覧を開かない（通常入力のみ）
        // 代わりにタグ一覧が開いている場合は閉じる
        searchInput.addEventListener('focus', () => {
          keywordFloatingBox.classList.remove('show');
        });

        // ★ 追加: 「🏷️ タグ」ボタンを押した時の処理
        if (tagToggleBtn) {
          tagToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            // キーボードが出ていれば閉じる
            searchInput.blur();
            // タグ一覧を表示/非表示トグル
            keywordFloatingBox.classList.toggle('show');
          });
        }

        // ×ボタンクリック時のクリア処理
        searchClearBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          searchInput.value = '';
          selectedTags = []; // 選択中のタグもリセット
          renderActiveTags();
          searchClearBtn.style.display = 'none';
          executeSearch();
          searchInput.focus();
        });

        // 枠外タップでタグ一覧を閉じる
        document.addEventListener('click', (e) => {
          if (!searchWrapper.contains(e.target)) {
            keywordFloatingBox.classList.remove('show');
          }
        });

        searchBtn.addEventListener('click', () => {
          keywordFloatingBox.classList.remove('show');
          executeSearch();
        });

        searchInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            keywordFloatingBox.classList.remove('show');
            executeSearch();
          }
        });
      }

      function executeSearch() {
        const queryInput = searchInput.value.trim().toLowerCase();
        keywordFloatingBox.classList.remove('show');

        // 入力文字列（スペース区切り）と選択済みタグをすべて結合して小文字化
        const inputTerms = queryInput ? queryInput.split(/\s+/).filter(Boolean) : [];
        const allSearchTerms = [...selectedTags.map(t => t.toLowerCase()), ...inputTerms];

        if (allSearchTerms.length === 0) {
          // ★ 変更: 検索条件がない場合は #HIDDEN タグが付いていない動画のみを表示
          filteredVideos = allVideos.filter(video => {
            if (!Array.isArray(video.keywords)) return true;
            return !video.keywords.some(kw => kw.toUpperCase() === '#HIDDEN');
          });
        } else {
          // 選択タグ + 入力ワードの「すべて」を含む動画のみ抽出 (AND検索)
          filteredVideos = allVideos.filter(video => {
            const jsonString = JSON.stringify(video).toLowerCase();
            return allSearchTerms.every(term => jsonString.includes(term));
          });
        }

        sortVideos();
        resetVideoListDisplay();
      }

    function resetVideoListDisplay() {
      videoListContainer.innerHTML = '';
      loadedCount = 0;
      currentVideoIndex = -1;

      if (filteredVideos.length === 0) {
        videoListContainer.innerHTML = '<p style="text-align: center; color: #888; font-size: 0.8rem; padding: 10px;">該当する動画がありません。</p>';
        return;
      }

      loadMoreVideos();
    }

    function loadMoreVideos() {
      if (loadedCount >= filteredVideos.length || isLoadingMore) return;
      isLoadingMore = true;

      const nextBatch = filteredVideos.slice(loadedCount, loadedCount + PAGE_SIZE);

      const html = nextBatch.map((video, index) => {
        const globalIndex = loadedCount + index;
        const thumbnailUrl = `https://img.youtube.com/vi/${video.id}/mqdefault.jpg`;
        const isActive = globalIndex === currentVideoIndex ? 'active' : '';

        let keywordsHtml = '';
        if (Array.isArray(video.keywords) && video.keywords.length > 0) {
          const kwItems = video.keywords.map(kw => `<span class="video-keyword-item" data-keyword="${kw}">${kw}</span>`).join(' ');
          keywordsHtml = `<div class="video-keywords">${kwItems}</div>`;
        }

        let prefix = '';
        if (video.mode === 'lite') {
          prefix = '<small class="title-prefix">(仮)</small>';
        } else if (video.words_built === 'completed') {
          prefix = '<small class="title-prefix">[単語]</small>';
        }

        return `
          <div class="video-item ${isActive}" data-index="${globalIndex}" data-file="${video.file}" data-id="${video.id}">
            <img src="${thumbnailUrl}" alt="${video.title}" class="video-thumbnail" />
            <div class="video-info">
              <span class="playing-badge">▶ 再生中</span>
              <div class="video-title">${prefix}${getI18nText(video.title)}</div>
              ${keywordsHtml}
            </div>
          </div>
        `;
      }).join('');

      videoListContainer.insertAdjacentHTML('beforeend', html);
      loadedCount += nextBatch.length;
      isLoadingMore = false;

      bindVideoItemEvents();
    }

    function bindVideoItemEvents() {
      const items = videoListContainer.querySelectorAll('.video-item');
      items.forEach(item => {
        if (!item.dataset.bound) {
          item.dataset.bound = "true";
          item.addEventListener('click', (e) => {
            // bindVideoItemEvents 内の修正部分
            if (e.target.classList.contains('video-keyword-item')) {
              e.stopPropagation();
              const kw = e.target.dataset.keyword;
              addTag(kw); // 直接タグ追加
              return;
            }

            const index = parseInt(item.dataset.index, 10);
            const fileName = item.dataset.file;
            const videoId = item.dataset.id;
            
            selectVideoByIndex(index, fileName, videoId);
          });
        }
      });
    }

    // 修正後
    function selectVideoByIndex(index, fileName, videoId, updateUrl = true, scrollToContent = true) {
      // ★ content-layout より下（画面外）にスクロールしている場合のみ、.frame-seek-controls の位置までスクロールアップする
            if (scrollToContent) {
              const targetElement = document.querySelector('.frame-seek-controls');
              if (targetElement) {
                const rect = targetElement.getBoundingClientRect();
                const currentScrollTop = window.pageYOffset || document.documentElement.scrollTop;
                // .frame-seek-controls の絶対位置を取得
                const targetScrollTop = rect.top + currentScrollTop;

                // 現在のスクロール位置が対象要素より下にある場合のみスムーズにスクロール
                if (currentScrollTop > targetScrollTop) {
                  window.scrollTo({
                    top: targetScrollTop,
                    behavior: 'smooth'
                  });
                }
              }
            }

      currentVideoIndex = index;

      const items = videoListContainer.querySelectorAll('.video-item');
      items.forEach(item => {
        if (parseInt(item.dataset.index, 10) === index) {
          item.classList.add('active');
        } else {
          item.classList.remove('active');
        }
      });

      if (updateUrl) {
        const newUrl = `${window.location.pathname}?v=${videoId}`;
        window.history.pushState({ videoId: videoId }, '', newUrl);
      }

      loadVideo(fileName, videoId);
    }

    function setupScrollListener() {
      videoListSection.addEventListener('scroll', () => {
        if (videoListSection.scrollTop + videoListSection.clientHeight >= videoListSection.scrollHeight - 20) {
          loadMoreVideos();
        }
      });

      window.addEventListener('scroll', () => {
        if (window.innerWidth <= 850) {
          if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 150) {
            loadMoreVideos();
          }
        }
      });
    }

  function loadVideo(fileName, videoId) {
  if (!fileName || !videoId) return;

  activeIndex = -1;

  if (overlaySpeaker) overlaySpeaker.textContent = '';
  if (overlayText) overlayText.textContent = '';

  if (transcriptSection) {
    transcriptSection.scrollTop = 0;
  }

  // ★ 追加：#NO PERMISSION タグの判定ロジック
  const currentVideo = allVideos.find(v => v.id === videoId || v.file === fileName);
  const isNoPermission = currentVideo && Array.isArray(currentVideo.keywords) &&
    currentVideo.keywords.some(kw => kw.toUpperCase() === '#NO PERMISSION');

  const iframeWrapperEl = document.getElementById('iframe-wrapper');
  const noPermissionContainer = document.getElementById('no-permission-container');
  const externalVideoLink = document.getElementById('external-video-link');

  if (isNoPermission) {
    // 動画プレイヤーを一時停止・隠して、外部リンク案内を表示
    if (player && typeof player.pauseVideo === 'function') {
      player.pauseVideo();
    }
    if (iframeWrapperEl) iframeWrapperEl.style.display = 'none';
    if (noPermissionContainer) {
      noPermissionContainer.style.display = 'block';
      if (externalVideoLink) {
        externalVideoLink.href = `https://www.youtube.com/watch?v=${videoId}`;
      }
    }
  } else {
    // 通常の動画表示
    if (iframeWrapperEl) iframeWrapperEl.style.display = 'block';
    if (noPermissionContainer) noPermissionContainer.style.display = 'none';
    initPlayer(videoId);
  }

  // ★ 以下の字幕（transcript）読み込み処理はそのまま実行されるため、字幕データ・スクロール同期・単語辞書は通常どおり動作します
  const formattedKeywords = Array.isArray(currentVideo?.keywords)
    ? currentVideo.keywords.join(' ')
    : (currentVideo?.keywords || '');

  const videoDescription = currentVideo ? [
    `${currentVideo.published_at || ''}`,
    `${getI18nText(currentVideo.title)}`,
    `${currentVideo.original_title || ''}`,
    `${formattedKeywords}`
  ].join('\n') : '';

  const transcriptPath = `data/transcripts/${fileName}`;
  const wordsPath = `data/words/word_${videoId}.json`;

  // 字幕データと単語データを並行して取得
  Promise.all([
    fetch(transcriptPath).then(res => {
      if (!res.ok) throw new Error(`${transcriptPath} の取得に失敗しました`);
      return res.json();
    }),
    fetch(wordsPath).then(res => {
      if (!res.ok) {
        console.warn(`${wordsPath} の取得に失敗したため、wordsなしで処理します`);
        return null;
      }
      return res.json();
    }).catch(err => {
      console.warn(`単語データ取得エラー (${wordsPath}):`, err);
      return null;
    })
  ])
  .then(([transcriptJson, wordsJson]) => {
    const rawTranscript = transcriptJson.transcript || [];
    const transcriptWordsList = wordsJson?.transcript_words || [];

    // id をキーにした単語マップを作成 (id:1 => words配列)
    const wordsMap = new Map();
    transcriptWordsList.forEach(item => {
      if (item && item.id !== undefined) {
        // データフォーマットに応じて property を正規化
        const words = (item.words || []).map(w => ({
          text: w.text,
          kana: w.pronunciation_kana || w.kana || '',
          meaning: w.meaning || ''
        }));
        wordsMap.set(item.id, words);
      }
    });

    // 字幕データに words 配列をマージ（idが一致するもの、またはインデックス順にフォールバック）
    transcriptData = rawTranscript.map((item, index) => {
      const itemId = item.id !== undefined ? item.id : (index + 1);
      const matchedWords = wordsMap.get(itemId) || [];
      return {
        ...item,
        words: matchedWords
      };
    });

    // 概要文（videoDescription）を第2引数として渡す
    renderTranscript(transcriptData, videoDescription);
  })
  .catch(error => {
    console.error('字幕データ取得エラー:', error);
    transcriptData = [];
    transcriptContainer.innerHTML = `<p style="color: red; text-align: center;">字幕データの読み込みに失敗しました。(${transcriptPath})</p>`;
  });
}

    /* ★ 修正・拡張：字幕と単語インライン辞書の描画関数 */
    function renderTranscript(transcriptList, description = '') {
      if (!transcriptList || transcriptList.length === 0) {
        transcriptContainer.innerHTML = '<p style="text-align: center;">字幕データがありません。</p>';
        return;
      }

      // ★ 現在選択中の動画IDを取得（study.htmlへの遷移用）
      const currentVideo = filteredVideos[currentVideoIndex];
      const currentVideoId = currentVideo ? currentVideo.id : '';

      // ★ 追加: 動画概要が存在する場合は先頭に概要HTMLを作成（右上ボタン付き）
      let descriptionHtml = '';
      if (description && description.trim() !== '') {
        const studyUrl = currentVideoId ? `study.html?v=${encodeURIComponent(currentVideoId)}` : 'study.html';
        
        descriptionHtml = `
          <div class="video-description-box">
            <a href="${studyUrl}" class="description-study-btn" title="学習モードで開く（拡大）">
              <!-- 画面拡大（フルスクリーン/外部起動）をイメージしたSVGアイコン -->
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 3 21 3 21 9"></polyline>
                <polyline points="9 21 3 21 3 15"></polyline>
                <line x1="21" y1="3" x2="14" y2="10"></line>
                <line x1="3" y1="21" x2="10" y2="14"></line>
              </svg>
            </a>
            <div>${escapeHtml(description).replace(/\n/g, '<br>')}</div>
          </div>
        `;
      }

      const html = transcriptList.map((item, index) => {
        const startTime = parseFloat(item.start || 0);
        const speakerText = item.speaker ? `<span style="color: #007bff; font-weight: bold; margin-right: 6px;">${item.speaker}:</span>` : '';

        // タイ語テキストの組み立て（wordsデータがあればクリック可能に分割）
        let thaiHtml = item.text || '';
        if (Array.isArray(item.words) && item.words.length > 0) {
          thaiHtml = item.words.map(w => {
            const escapedText = escapeHtml(w.text);
            const escapedKana = escapeHtml(w.kana || '');
            const escapedMeaning = escapeHtml(w.meaning || '');
            return `<span class="dict-word" data-word="${escapedText}" data-kana="${escapedKana}" data-meaning="${escapedMeaning}">${escapedText}</span>`;
          }).join('');
        }

        const translationText = item.translations ? getI18nText(item.translations) : (item.translation || '');

        // ★ 言語選択（currentLang）に応じて発音表記をカナ/ローマ字に切り替え
        const pronunciationText = (currentLang === 'ja') 
          ? (item.pronunciation_kana || '') 
          : (item.pronunciation_roman || '');

        return `
          <div class="transcript-card" data-index="${index}" data-start="${startTime}">
            <div class="text-translation" style="border-top: none; padding-top: 0; font-weight: bold; margin-bottom: 3px;">
              ${speakerText}${translationText}
            </div>
            <div class="text-thai">${thaiHtml}</div>
            <div class="text-kana" style="margin-top: 2px;">${pronunciationText}</div>
            
            <!-- 単語詳細のインライン表示エリア -->
            <div class="word-detail-box"></div>
          </div>
        `;
      }).join('');

      // 先頭に概要（descriptionHtml）を結合して挿入
      transcriptContainer.innerHTML = descriptionHtml + html;

      // ★ 単語（dict-word）のクリックイベント処理を設定
      const dictWords = transcriptContainer.querySelectorAll('.dict-word');
      dictWords.forEach(wordSpan => {
        wordSpan.addEventListener('click', (e) => {
          e.stopPropagation(); // 字幕カードの動画再生位置移動イベントを止める

          const card = wordSpan.closest('.transcript-card');
          const detailBox = card.querySelector('.word-detail-box');
          const word = wordSpan.dataset.word;
          const kana = wordSpan.dataset.kana;
          const meaning = wordSpan.dataset.meaning;

          // すでに同じ単語が開かれていればトグル（閉じる）
          if (wordSpan.classList.contains('active-word') && detailBox.style.display === 'block') {
            detailBox.style.display = 'none';
            wordSpan.classList.remove('active-word');
            return;
          }

          // カード内の全単語のハイライトをリセット
          card.querySelectorAll('.dict-word').forEach(w => w.classList.remove('active-word'));
          wordSpan.classList.add('active-word');

          // 意味とカタカナをセットして表示
          detailBox.innerHTML = `<strong>${word}</strong> ${kana ? `<span style="color:#e67e22;">[${kana}]</span>` : ''} : ${meaning}`;
          detailBox.style.display = 'block';
        });
      });

      // 字幕カード全体のクリックイベント（タイムスタンプ移動）
      const cards = transcriptContainer.querySelectorAll('.transcript-card');
      cards.forEach(card => {
        card.addEventListener('click', () => {
          const startTime = parseFloat(card.dataset.start);
          if (player && typeof player.seekTo === 'function') {
            player.seekTo(startTime, true);
            player.playVideo();
          }
        });
      });
    }

    // HTMLエスケープヘルパー
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
    }

    // ★ ブラウザの「戻る」「進む」ボタンが押された時の処理
    window.addEventListener('popstate', (e) => {
      const urlParams = new URLSearchParams(window.location.search);
      const videoId = urlParams.get('v');
      
      if (videoId && filteredVideos.length > 0) {
        const index = filteredVideos.findIndex(v => v.id === videoId || v.file === videoId);
        if (index !== -1) {
          selectVideoByIndex(index, filteredVideos[index].file, filteredVideos[index].id, false);
        }
      }
    });

    document.addEventListener('keydown', (e) => {
      if (document.activeElement === searchInput) {
        return;
      }

      const key = e.key;
      const code = e.keyCode || e.which;

      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(key) || [37, 38, 39, 40, 32].includes(code)) {
        e.preventDefault();
      }

      // 既存の keydown イベント内の ArrowLeft / ArrowRight 処理を以下に置き換え
      if (key === 'ArrowLeft' || code === 37) {
        if (player && typeof player.getCurrentTime === 'function') {
          const cur = player.getCurrentTime();
          let step = 0.05; // デフォルト：コマ戻し (0.05秒)
          if (e.shiftKey) step = 1.0; // Shift併用：1秒戻る
          if (e.altKey) step = 10.0;  // Alt併用：10秒戻る

          if (step === 0.05) player.pauseVideo(); // コマ送りの時は一時停止
          player.seekTo(Math.max(0, cur - step), true);
        }
      }

      if (key === 'ArrowRight' || code === 39) {
        if (player && typeof player.getCurrentTime === 'function') {
          const cur = player.getCurrentTime();
          let step = 0.05; // デフォルト：コマ送り (0.05秒)
          if (e.shiftKey) step = 1.0; // Shift併用：1秒進む
          if (e.altKey) step = 10.0;  // Alt併用：10秒進む

          if (step === 0.05) player.pauseVideo(); // コマ送りの時は一時停止
          player.seekTo(cur + step, true);
        }
      }

      if (key === 'MediaPlayPause' || key === ' ' || key === 'Enter' || code === 179 || code === 32 || code === 13) {
        if (player && typeof player.getPlayerState === 'function') {
          const state = player.getPlayerState();
          if (state === YT.PlayerState.PLAYING) {
            player.pauseVideo();
          } else {
            player.playVideo();
          }
        }
      }
    });

    // 字幕設定用の要素
    const subSizeBtn = document.getElementById('sub-size-btn');
    const subStyleBtn = document.getElementById('sub-style-btn');

    // 切り替え用クラスの一覧定義
    const sizeClasses = ['size-xxsmall', 'size-xsmall', 'size-small', 'size-medium', 'size-large', 'size-xlarge'];
    const styleClasses = ['style-default', 'style-outline', 'style-highcontrast', 'style-soft', 'style-x-fit'];

    // 保存された設定の読み込み（デフォルト設定：medium(index: 3) / default(index: 0)）
    let currentSizeIndex = parseInt(localStorage.getItem('sub_size_index') || '3', 10);
    let currentStyleIndex = parseInt(localStorage.getItem('sub_style_index') || '0', 10);

    // 初期設定の適用
    function applySubtitleSettings() {
      // サイズ設定の更新
      sizeClasses.forEach(cls => overlaySubtitleBox.classList.remove(cls));
      overlaySubtitleBox.classList.add(sizeClasses[currentSizeIndex]);

      // デザイン設定の更新
      styleClasses.forEach(cls => overlaySubtitleBox.classList.remove(cls));
      overlaySubtitleBox.classList.add(styleClasses[currentStyleIndex]);
    }

    // ボタンイベント設定
    if (subSizeBtn) {
      subSizeBtn.addEventListener('click', (e) => {
        e.stopPropagation(); // 字幕位置の左右切替イベントへの波及を防止
        currentSizeIndex = (currentSizeIndex + 1) % sizeClasses.length;
        localStorage.setItem('sub_size_index', currentSizeIndex);
        applySubtitleSettings();
      });
    }

    if (subStyleBtn) {
      subStyleBtn.addEventListener('click', (e) => {
        e.stopPropagation(); // 字幕位置の左右切替イベントへの波及を防止
        currentStyleIndex = (currentStyleIndex + 1) % styleClasses.length;
        localStorage.setItem('sub_style_index', currentStyleIndex);
        applySubtitleSettings();
      });
    }

    // 初期化時にスタイル適用
    applySubtitleSettings();
    

    // ★ シェア＆URLコピー機能の実装
    const xShareBtn = document.getElementById('x-share-btn');
    const copyUrlBtn = document.getElementById('copy-url-btn');

    // X（Twitter）でシェア
    // X（Twitter）でシェア（4パターンの例文をランダム抽出）
    if (xShareBtn) {
      xShareBtn.addEventListener('click', () => {
        // currentVideoIndex に基づき、videos.json 由来の配列データからタイトルを取得
        const currentVideo = filteredVideos[currentVideoIndex];
        const videoTitle = (currentVideo && currentVideo.title) ? getI18nText(currentVideo.title) : 'PERSES動画';
        const currentUrl = window.location.href;

        // 4パターンの例文テンプレート
        const templates = [
          // パターン1：エモさ・推し活共感重視
          `🎬【日本語字幕付き】『${videoTitle}』\n\nPERSESメンバーのタイ語の発言やニュアンスを日本語字幕で楽しめます✨\n字幕をクリックで好きなシーンへジャンプ！\n\n#PERSES #パーセス #PERSES和訳\n`,

          // パターン2：機能（字幕＆単語辞書）アピール重視(データ未完成のためコメントアウト)
          //`💡 タイ語学習にも使える PERSES 日本語字幕アーカイブ\n\n『${videoTitle}』の和訳＆タイ語字幕を公開中！\n気になるタイ語単語をタップすると読み方と意味が出る辞書機能つき🔍\n\n#PERSES #PERSES_TH #PERSES和訳\n`,

          // パターン2.5：機能（字幕＆単語辞書）アピール重視(データ未完成のためコメントアウト)
          `💡 タイ語学習にも使える PERSES 日本語字幕アーカイブ\n\n『${videoTitle}』の和訳＆タイ語字幕を公開中！\nぜひチェックしてみてください✨\n\n#PERSES #PERSES_TH #PERSES和訳\n`,

          // パターン3：短くすっきり
          `PERSES『${videoTitle}』の日本語字幕動画です🎥\n動画と字幕が連動して流れるので推しの会話がリアルタイムで楽しめます✨\n\n🔽 翻訳付きで見る\n#PERSES #PERSES和訳\n`,

          // パターン4：ファン（PIXES）への呼びかけ風
          `日本のPIESESのみなさん🙌\n『${videoTitle}』の日本語翻訳字幕をアップしました！\n\n字幕と動画が連動しているので、可愛い発言を日本語でチェックしてみてください✨\n\n🔽 動画はこちらから\n#PERSES #PERSES和訳\n`
        ];

        // ランダムに1つ選択
        const randomText = templates[Math.floor(Math.random() * templates.length)];

        // シェア用URLの作成
        const shareUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(randomText)}&url=${encodeURIComponent(currentUrl)}`;

        // 別ウィンドウで投稿画面を開く
        window.open(shareUrl, '_blank', 'width=550,height=420');
      });
    }

    // URLをクリップボードにコピー
    if (copyUrlBtn) {
      copyUrlBtn.addEventListener('click', () => {
        const currentUrl = window.location.href;

        navigator.clipboard.writeText(currentUrl).then(() => {
          // コピー成功の簡易フィードバック（ボタンを一瞬緑色にする）
          const originalColor = copyUrlBtn.style.color;
          copyUrlBtn.style.color = '#28a745';
          copyUrlBtn.style.borderColor = '#28a745';
          
          alert('動画のURLをコピーしました！');

          setTimeout(() => {
            copyUrlBtn.style.color = '';
            copyUrlBtn.style.borderColor = '';
          }, 1500);
        }).catch(err => {
          console.error('URLコピー失敗:', err);
        });
      });
    }

    // ボタンを表示し、タイマーをリセットする関数
    function showVideoControls() {
      if (!iframeWrapper) return;

      // ボタンを表示状態にする
      iframeWrapper.classList.add('user-active');

      // 既存のタイマーをクリア
      if (hideControlsTimer) {
        clearTimeout(hideControlsTimer);
      }

      // 3秒間無操作状態が続いたら非表示にする
      hideControlsTimer = setTimeout(() => {
        iframeWrapper.classList.remove('user-active');
      }, 3000);
    }

    // PC用：動画領域内でカーソルが動いた時
    if (iframeWrapper) {
      iframeWrapper.addEventListener('mousemove', showVideoControls);
      iframeWrapper.addEventListener('mouseenter', showVideoControls);

      // スマホ・タブレット用：動画領域をタップした時
      iframeWrapper.addEventListener('touchstart', showVideoControls, { passive: true });
      iframeWrapper.addEventListener('click', showVideoControls);
    }

    // 字幕の表示 / 非表示状態を更新する関数
    function updateSubtitleVisibility(visible) {
      isSubtitleVisible = visible;
      if (isSubtitleVisible) {
        overlaySubtitleContainer.classList.remove('sub-hidden');
        if (subToggleBtn) subToggleBtn.classList.add('active');
        if (seekSubToggleBtn) seekSubToggleBtn.classList.add('active'); // ★ 追加
      } else {
        overlaySubtitleContainer.classList.add('sub-hidden');
        if (subToggleBtn) subToggleBtn.classList.remove('active');
        if (seekSubToggleBtn) seekSubToggleBtn.classList.remove('active'); // ★ 追加
      }
    }

    // 1. ボタンの手動クリックで表示 / 非表示を切り替え
    if (subToggleBtn) {
      subToggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        updateSubtitleVisibility(!isSubtitleVisible);
      });
    }

    // ヘッダー側：字幕 ON/OFF トグル
    if (seekSubToggleBtn) {
      seekSubToggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        updateSubtitleVisibility(!isSubtitleVisible);
      });
    }

    // ヘッダー側：文字サイズ変更
    if (seekSubSizeBtn) {
      seekSubSizeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        currentSizeIndex = (currentSizeIndex + 1) % sizeClasses.length;
        localStorage.setItem('sub_size_index', currentSizeIndex);
        applySubtitleSettings();
      });
    }

    // ヘッダー側：デザイン切替
    if (seekSubStyleBtn) {
      seekSubStyleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        currentStyleIndex = (currentStyleIndex + 1) % styleClasses.length;
        localStorage.setItem('sub_style_index', currentStyleIndex);
        applySubtitleSettings();
      });
    }

    /**
     * 検索エリアへスムーズにジャンプ
     */
    function scrollToSearch() {
      const searchArea = document.getElementById('search-wrapper');

      if (searchArea) {
        // 検索エリアの位置へスムーズスクロール
        searchArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }


    const themeToggleBtn = document.getElementById('theme-toggle-btn');
    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    // 単色SVGの定義（CSSのcolor属性に従って色が変わります）
    const sunIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>`;

    const moonIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12.3 2a10 10 0 0 0 9.7 12.3 10 10 0 1 1-9.7-12.3z"/></svg>`;

    // 初期状態の判定
    if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
      document.body.classList.add('dark-mode');
      // textContent から innerHTML に変更し SVG を挿入
      if (themeToggleBtn) themeToggleBtn.innerHTML = sunIcon;
    } else {
      if (themeToggleBtn) themeToggleBtn.innerHTML = moonIcon;
    }

    if (themeToggleBtn) {
      themeToggleBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        
        // textContent から innerHTML に変更し SVG を切り替え
        themeToggleBtn.innerHTML = isDark ? sunIcon : moonIcon;
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const langSelect = document.getElementById('langSelect');
      if (langSelect) {
        langSelect.value = currentLang; // プルダウンの見た目を保存された言語に合わせる
      }
      updateStaticUI(currentLang); // 固定UIを保存された言語で更新
    });



    /**
     * 画面録画の開始・停止を切り替える関数
     */
    async function toggleScreenRecord(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }

      const recordBtn = document.getElementById('screen-record-btn');

      // すでに録画中の場合は停止処理
      if (isRecording) {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
        return;
      }

      // 録画開始処理
      try {
        // 画面（画面全体・ウィンドウ・タブ）の映像および音声を取得
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: { mediaSource: "screen" },
          audio: true // 音声も同時にキャプチャ（ユーザーがタブ共有時に「音声も共有」をチェックした場合）
        });

        recordedChunks = [];
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

        // 録画データが小分けに届くたびに配列に保持
        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) {
            recordedChunks.push(event.data);
          }
        };

        // 録画停止時の自動ダウンロード処理
        mediaRecorder.onstop = () => {
          isRecording = false;
          if (recordBtn) {
            recordBtn.style.color = '';
            recordBtn.classList.remove('recording');
          }

          // 録画ストリームのトラックを停止（共有中バーを消す）
          stream.getTracks().forEach(track => track.stop());

          // 録画データが存在すれば WebM ファイルとして保存
          if (recordedChunks.length > 0) {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `PERSES_record_${new Date().toISOString().slice(0,10)}.webm`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          }
        };

        // ユーザーがブラウザ標準の「共有を停止」ボタンを押した場合のハンドリング
        stream.getVideoTracks()[0].onended = () => {
          if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
          }
        };

        // 録画スタート
        mediaRecorder.start();
        isRecording = true;

        // ボタンの見た目を録画中状態にする（アイコンの色を赤に変更など）
        if (recordBtn) {
          recordBtn.style.color = '#ff4d4f';
          recordBtn.classList.add('recording');
        }

      } catch (err) {
        console.error('画面録画の開始に失敗しました:', err);
        // ユーザーが画面共有をキャンセルした場合などはエラーメッセージを出さない
      }
    }





    document.addEventListener('click', () => {
      window.focus();
    });

    window.addEventListener('DOMContentLoaded', () => {
      init();
      
      // 初期化（通常画面スタートなのでデフォルト「字幕なし」を適用）
      updateSubtitleVisibility(true);
      
      window.focus();
      document.body.focus();
    });
  </script>
