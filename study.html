<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>詳細学習 - PERSES</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #333333;
      --accent-color: #0d6efd;
      --border-color: #e0e0e0;
      --sub-text-color: #6c757d;
      --word-bg: rgba(0, 0, 0, 0.02);
      --word-hover-bg: rgba(13, 110, 253, 0.1);
      --tooltip-bg: #333333;
      --tooltip-text: #ffffff;
    }

    /* ==========================================
       ダークモード時のCSS変数・スタイル設定
       ========================================== */
    body.dark-mode {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --accent-color: #60a5fa;
      --border-color: #333333;
      --sub-text-color: #9ca3af;
      --word-bg: rgba(255, 255, 255, 0.05);
      --word-hover-bg: rgba(96, 165, 250, 0.2);
      --tooltip-bg: #e0e0e0;
      --tooltip-text: #121212;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      font-size: 90%; /* index.htmlの基本サイズに準拠 */
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0;
    }

    .header-nav {
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* SVGアイコン対応 戻るボタン */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background-color: var(--card-bg);
      color: var(--text-color);
      text-decoration: none;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      height: 34px;
    }

    .back-btn svg {
      display: block;
      pointer-events: none;
    }

    .back-btn:hover {
      opacity: 0.8;
      transform: translateY(-1px);
    }

    /* テーマ切り替えボタン */
    .theme-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      padding: 0;
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .theme-btn:hover {
      opacity: 0.8;
      transform: translateY(-1px);
    }

    .theme-btn svg {
      display: block;
      pointer-events: none;
    }

    .video-info {
      margin-bottom: 24px;
    }

    .video-info h1 {
      font-size: 1.25rem; /* デスクトップ時の見出しサイズを小さく設定 */
      font-weight: bold;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    /* トランスクリプト（カード）配置エリア */
    #transcript-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 各フレーズを囲むカード */
    .transcript-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      transition: background-color 0.3s, border-color 0.3s;
    }

    /* 1, 2, 3 の単語セットを並べるコンテナ */
    .words-container {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 12px;
      margin-bottom: 10px;
    }

    /* 1, 2, 3の単語単体ブロック（中央揃えセット） */
    .word-set {
      position: relative; /* フローティング表示の位置基準 */
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background-color: var(--word-bg);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer; /* クリック/タップエリア化 */
      transition: background-color 0.2s;
      user-select: none;
    }

    /* PCホバー時およびスマホタップ(active)時の背景ハイライト */
    .word-set:hover,
    .word-set.active {
      background-color: var(--word-hover-bg);
    }

    /* 上部に浮かび上がるフローティング（ポップアップ） */
    .word-set::after {
      content: attr(data-tooltip); /* JSで設定したテキストを表示 */
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%) translateY(-6px);
      background-color: var(--tooltip-bg);
      color: var(--tooltip-text);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      line-height: 1.4;
      white-space: pre-wrap; /* 改行を有効化 */
      text-align: left;     /* 複数行テキストを見やすく左揃え */
      min-width: max-content;
      max-width: 240px;     /* 端で折り返せるように上限設定 */
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    /* PCでのホバー時またはタップ(active)時にフローティングを表示 */
    .word-set:hover::after,
    .word-set.active::after {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(-10px);
    }

    /* 1. words.text (文字サイズ大) */
    .word-text {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent-color);
      border-bottom: 1px dashed var(--accent-color);
    }

    /* 2. words.meaning (文字サイズ小) */
    .word-meaning {
      font-size: 0.75rem;
      color: var(--sub-text-color);
      margin-top: 4px;
    }

    /* 3. words.kana (文字サイズ小) */
    .word-kana {
      font-size: 0.75rem;
      color: var(--sub-text-color);
      margin-top: 2px;
    }

    /* フレーズ全体の詳細エリア */
    .phrase-details {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px dashed var(--border-color);
    }

    /* 4. translation (中) */
    .translation {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--text-color);
      margin-bottom: 6px;
    }

    /* 5. pronunciation_roman (中) */
    .pronunciation-roman {
      font-size: 0.85rem;
      color: var(--sub-text-color);
      margin-top: 4px;
    }

    /* 6. pronunciation_kana (中) */
    .pronunciation-kana {
      font-size: 0.85rem;
      color: var(--sub-text-color);
      margin-top: 2px;
    }

    /* 7. text (タイ語原文)(大) */
    .phrase-text {
      font-size: 1.15rem;
      font-weight: 500;
      color: var(--accent-color);
      margin-top: 4px;
    }

    /* ==========================================
       レスポンシブ対応 (index.html の基準を適用)
       ========================================== */

    /* タブレット・小画面PC (1100px以下) */
    @media (max-width: 1100px) {
      body {
        padding: 16px;
      }
      .transcript-card {
        padding: 16px;
      }
    }

    /* スマートフォン画面 (768px以下) */
    @media (max-width: 768px) {
      body {
        padding: 12px;
      }

      .header-nav {
        margin-bottom: 16px;
      }

      .back-btn {
        padding: 5px 12px;
        font-size: 0.8rem;
      }

      .video-info h1 {
        font-size: 1.1rem; /* スマホ全般でのサイズ */
      }

      .transcript-card {
        padding: 14px;
      }

      .words-container {
        gap: 10px 8px;
      }

      .word-set {
        padding: 5px 8px;
      }

      .word-text {
        font-size: 1.0rem;
      }

      .word-meaning,
      .word-kana {
        font-size: 0.7rem;
      }

      .translation {
        font-size: 0.9rem;
      }

      .phrase-text {
        font-size: 1.05rem;
      }

      .pronunciation-roman,
      .pronunciation-kana {
        font-size: 0.8rem;
      }
    }

    /* 極小画面・スマホ縦持ち (480px以下) */
    @media (max-width: 480px) {
      body {
        padding: 10px 8px;
      }

      .video-info h1 {
        font-size: 1.0rem; /* 極小画面用のサイズ */
      }

      .transcript-card {
        padding: 12px 10px;
      }

      .words-container {
        gap: 8px 6px;
      }

      .word-set {
        padding: 4px 6px;
      }

      .word-text {
        font-size: 0.95rem;
      }

      .word-meaning,
      .word-kana {
        font-size: 0.65rem;
      }

      .translation {
        font-size: 0.85rem;
      }

      .phrase-text {
        font-size: 1.0rem;
      }

      .pronunciation-roman,
      .pronunciation-kana {
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-nav">
      <!-- SVGアイコン付き 戻るボタン -->
      <a href="index.html" id="back-btn" class="back-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </a>

      <!-- ダークモード切り替えボタン -->
      <button class="theme-btn" id="theme-toggle-btn" title="ダークモード切替">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12.3 2a10 10 0 0 0 9.7 12.3 10 10 0 1 1-9.7-12.3z"/>
        </svg>
      </button>
    </div>

    <div class="video-info">
      <h1 id="video-title">読み込み中...</h1>
    </div>

    <!-- カード出力エリア -->
    <div id="transcript-container"></div>
  </div>

  <script>
    // --- ナイトモード（ダークモード）切り替え制御 ---
    const themeToggleBtn = document.getElementById('theme-toggle-btn');

    // マスタデータの保持用変数
    let characterMasterData = null;
    
    // 前回の設定（localStorage）の取得・初期適用
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      document.body.classList.add('dark-mode');
    }

    if (themeToggleBtn) {
      themeToggleBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      });
    }

    // URLからパラメータ(?v=xxx または ?json=xxx)を取得
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('v');
    const jsonPathOverride = urlParams.get('json');

    // 戻るボタンの遷移先を動的に設定
    const backBtn = document.getElementById('back-btn');
    if (backBtn) {
      if (videoId) {
        backBtn.href = `index.html?v=${encodeURIComponent(videoId)}`;
      } else {
        backBtn.href = 'index.html';
      }
    }

    // index.html側でリストやインデックスJSONを保持している場合に参照するパスを構築
    function resolveJsonPath() {
      // 明示的に json パラメータでパスが渡されている場合 (例: ?json=...)
      if (jsonPathOverride) {
        return decodeURIComponent(jsonPathOverride);
      }
      // 動画IDのみ渡されている場合
      if (videoId) {
        return `./data/transcripts/video_${videoId}.json`; 
      }
      // デフォルトのフォールバック
      return './data/transcripts/video_uzofjpRpu6Y.json';
    }

    // マスタデータの読み込み関数
    async function loadCharacterMaster() {
      try {
        const res = await fetch('./data/character_master.json');
        if (res.ok) {
          characterMasterData = await res.json();
        }
      } catch (err) {
        console.warn('character_master.json の読み込みに失敗しました:', err);
      }
    }

    // 単語文字列からマスタ情報を検索し、改行区切りのツールチップテキストを生成する関数
    function generateTooltipText(wordText) {
      if (!wordText || !characterMasterData) {
        return wordText || '';
      }

      const results = [];
      let currentText = wordText;

      // 1. 母音の判定（เ-า などの前後・囲み型母音に対応）
      if (characterMasterData.vowels) {
        // キーの長さが長い順（文字数の多い複合母音優先）にソート
        const sortedVowelKeys = Object.keys(characterMasterData.vowels).sort((a, b) => b.length - a.length);

        for (const vKey of sortedVowelKeys) {
          // 「เ-า」 -> 「เ.?.?า」 のようにハイフン部分を任意の子音（1〜2文字）に置き換える正規表現を作成
          // 例: เ-า なら เ と า の間に子音があるか判定
          const patternString = vKey.replace(/-/g, '[\u0E01-\u0E2E\u0E47-\u0E4C]*?');
          
          // 単一の母音記号（例: -ะ, -ิ）はハイフンを除去した1文字で判定
          const cleanKey = vKey.replace(/-/g, '');

          let matched = false;

          if (vKey.includes('-') && vKey.length > 2) {
            // เ-า や เ-ีย などの複数パーツで構成される母音
            const parts = vKey.split('-').filter(p => p.length > 0);
            // 単語の中に母音のすべてのパーツが含まれているかチェック
            const hasAllParts = parts.every(part => currentText.includes(part));

            if (hasAllParts) {
              const vData = characterMasterData.vowels[vKey];
              results.push(`${vKey}：[${vData.type || '母音'}] ${vData.desc || vData.name}`);
              
              // 母音パーツ（เ や า）をテキストから消去して重複判定を防止
              parts.forEach(part => {
                currentText = currentText.replace(part, '');
              });
              matched = true;
            }
          } else if (cleanKey && currentText.includes(cleanKey)) {
            // -ะ や -ิ などの単一パーツ母音
            const vData = characterMasterData.vowels[vKey];
            results.push(`${vKey}：[${vData.type || '母音'}] ${vData.desc || vData.name}`);
            currentText = currentText.replace(cleanKey, '');
            matched = true;
          }
        }
      }

      // 2. 残った文字（子音、声調記号、数字、記号）を1文字ずつ判定
      const chars = Array.from(currentText);

      chars.forEach((ch, index) => {
        let found = null;
        let category = '';

        // 声調記号（-่, -้ など）
        if (characterMasterData.tone_marks) {
          found = characterMasterData.tone_marks[`-${ch}`] || characterMasterData.tone_marks[ch];
          if (found) category = '声調記号';
        }

        // 子音
        if (!found && characterMasterData.consonants && characterMasterData.consonants[ch]) {
          found = characterMasterData.consonants[ch];
          
          // 単語の末尾で末子音マスタにある場合は補足表示
          if (index === chars.length - 1 && characterMasterData.final_consonants && characterMasterData.final_consonants[ch]) {
            const finalData = characterMasterData.final_consonants[ch];
            category = `${found.class || '子音'} (末子音: ${finalData.group})`;
          } else {
            category = found.class || '子音';
          }
        }

        // 記号・数字
        if (!found && characterMasterData.symbols && characterMasterData.symbols[ch]) {
          found = characterMasterData.symbols[ch];
          category = '記号';
        } else if (!found && characterMasterData.numbers && characterMasterData.numbers[ch]) {
          found = characterMasterData.numbers[ch];
          category = '数字';
        }

        if (found) {
          const descText = found.desc || found.name || '';
          results.push(`${ch}：[${category}] ${descText}`);
        }
      });

      if (results.length === 0) {
        return wordText;
      }

      return results.join('\n');
    }

    // データ読み込みとレンダリング（マスタ読み込みを追加）
    async function loadStudyData() {
      // マスタデータと学習データを並行して取得
      await loadCharacterMaster();
      const jsonPath = resolveJsonPath();

      try {
        const response = await fetch(jsonPath);
        if (!response.ok) {
          throw new Error(`データの取得に失敗しました (Path: ${jsonPath})`);
        }
        const data = await response.json();

        // タイトル表示
        document.getElementById('video-title').textContent = data.title || '詳細学習';

        // トランスクリプト描画
        renderTranscript(data.transcript);
      } catch (error) {
        console.error(error);
        document.getElementById('transcript-container').innerHTML = 
          `<p style="color: red;">指定された学習データ (${jsonPath}) を読み込めませんでした。</p>`;
      }
    }

    // カード描画処理
    function renderTranscript(transcriptList) {
      const container = document.getElementById('transcript-container');
      container.innerHTML = '';

      if (!transcriptList || transcriptList.length === 0) {
        container.innerHTML = '<p>表示できるトランスクリプトがありません。</p>';
        return;
      }

      transcriptList.forEach(item => {
        const card = document.createElement('div');
        card.className = 'transcript-card';

        // 1, 2, 3 の単語セットエリア
        const wordsContainer = document.createElement('div');
        wordsContainer.className = 'words-container';

        if (item.words && item.words.length > 0) {
          item.words.forEach(word => {
            const wordSet = document.createElement('div');
            wordSet.className = 'word-set';
            
            // 動的に生成したツールチップテキストをセット
            const tooltipText = generateTooltipText(word.text);
            wordSet.setAttribute('data-tooltip', tooltipText);

            // 1. words.text (大)
            const textEl = document.createElement('div');
            textEl.className = 'word-text';
            textEl.textContent = word.text || '';

            // 2. words.kana (小)
            const kanaEl = document.createElement('div');
            kanaEl.className = 'word-kana';
            kanaEl.textContent = word.kana || '';

            // 3. words.meaning (小)
            const meaningEl = document.createElement('div');
            meaningEl.className = 'word-meaning';
            meaningEl.textContent = word.meaning || '';

            wordSet.appendChild(textEl);
            wordSet.appendChild(kanaEl);
            wordSet.appendChild(meaningEl);

            // クリック/タップイベントを word-set に設定
            wordSet.addEventListener('click', (e) => {
              e.stopPropagation();

              // 他の選択中のword-setからactiveを解除（スマホのトグル表示対応）
              document.querySelectorAll('.word-set.active').forEach(el => {
                if (el !== wordSet) el.classList.remove('active');
              });

              wordSet.classList.toggle('active');
            });

            wordsContainer.appendChild(wordSet);
          });
        }

        // 4, 5, 6, 7 の詳細ブロック
        const phraseDetails = document.createElement('div');
        phraseDetails.className = 'phrase-details';

        // 4. translation (中)
        const translationEl = document.createElement('div');
        translationEl.className = 'translation';
        translationEl.textContent = item.translation ? item.translation.trim() : '';

        // 5. pronunciation_roman (中)
        const romanEl = document.createElement('div');
        romanEl.className = 'pronunciation-roman';
        romanEl.textContent = item.pronunciation_roman ? item.pronunciation_roman.trim() : '';

        // 6. pronunciation_kana (中)
        const kanaPhraseEl = document.createElement('div');
        kanaPhraseEl.className = 'pronunciation-kana';
        kanaPhraseEl.textContent = item.pronunciation_kana ? item.pronunciation_kana.trim() : '';

        // 7. text (タイ語原文)(大)
        const textPhraseEl = document.createElement('div');
        textPhraseEl.className = 'phrase-text';
        textPhraseEl.textContent = item.text ? item.text.trim() : '';

        phraseDetails.appendChild(translationEl);
        phraseDetails.appendChild(textPhraseEl); // 7を4, 5, 6の次に追加
        phraseDetails.appendChild(romanEl);
        //phraseDetails.appendChild(kanaPhraseEl);

        card.appendChild(wordsContainer);
        card.appendChild(phraseDetails);

        container.appendChild(card);
      });
    }

    // 画面のどこかをタップした際にスマホのポップアップ表示(active)をクリア
    document.addEventListener('click', () => {
      document.querySelectorAll('.word-set.active').forEach(el => {
        el.classList.remove('active');
      });
    });

    // 初期化
    loadStudyData();
  </script>
</body>
</html>
