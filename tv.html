<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PERSES TV Player</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    
    /* Silk等での文字サイズ自動拡大を強制作動停止 */
    html, body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-size: 20px;
      -webkit-text-size-adjust: 100%;
      -moz-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    /* --------------------------------------------------
       フォーカス表示 (Spatial Navigation)
    -------------------------------------------------- */
    .focusable {
      outline: none;
      transition: outline 0.15s ease-in-out, transform 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
    }
    .focusable:focus {
      outline: 5px solid #00d2ff !important;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.9) !important;
      transform: scale(1.03);
      z-index: 10;
    }

    /* --------------------------------------------------
       メインUI (16:9 大画面 完全固定2カラムレイアウト)
    -------------------------------------------------- */
    #app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    /* ■ 左サイドバー */
    .sidebar {
      width: 440px;
      min-width: 440px;
      height: 100vh;
      background-color: #1a1a1a;
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      border-right: 2px solid #333;
    }

    .tag-section-title {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* タグエリアを可変高に調整 */
    .tag-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
      overflow-y: auto;
      padding-right: 6px;
      margin-bottom: 24px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .tag-container::-webkit-scrollbar {
      display: none;
    }

    .tag-btn {
      width: 100%;
      padding: 14px 18px;
      background-color: #2a2a2a;
      border: 2px solid #444;
      color: #ddd;
      border-radius: 8px;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
    }
    .tag-btn.active {
      background-color: #00d2ff;
      color: #000;
      font-weight: bold;
      border-color: #00d2ff;
    }

    /* 下部に移動した検索エリア */
    .search-section {
      border-top: 1px solid #333;
      padding-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-input {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      font-size: 1.1rem;
      border-radius: 8px;
      border: 2px solid #444;
      background-color: #2a2a2a;
      color: #fff;
    }

    .clear-btn {
      width: 100%;
      height: 52px;
      font-size: 1.1rem;
      background-color: #333;
      border: 2px solid #555;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
    }

    /* ■ 右メインエリア */
    .main-content {
      flex: 1;
      height: 100vh;
      padding: 30px;
      overflow-y: auto;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      padding-bottom: 60px;
    }

    .video-card {
      background-color: #222;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid #333;
    }

    .thumbnail-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background-color: #000;
    }
    .thumbnail-img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .card-info {
      padding: 16px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.4;
      margin: 0 0 10px 0;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      height: 4.2em;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .card-tag {
      font-size: 0.8rem;
      color: #aaa;
      background: #333;
      padding: 3px 8px;
      border-radius: 4px;
    }

    /* --------------------------------------------------
       再生画面 (全画面シアターモード)
    -------------------------------------------------- */
    #player-view {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-color: #000;
      z-index: 100;
    }
    #youtube-player {
      width: 100vw;
      height: 100vh;
    }

    .panel-trigger-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 115;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      border: 2px solid #666;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    #subtitle-overlay {
      position: absolute;
      bottom: 85px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      text-align: center;
      padding: 20px 30px;
      border-radius: 16px;
      transition: all 0.2s ease;
      z-index: 110;
      pointer-events: none;
      display: none;
    }

    .style-standard {
      background-color: rgba(0, 0, 0, 0.8);
      color: #ffffff;
    }
    .style-high-contrast {
      background-color: #000000;
      color: #ffeb3b;
      font-weight: bold;
    }
    .style-text-only {
      background-color: transparent;
      color: #ffffff;
      text-shadow: 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 0 3px 0 #000, 3px 0 0 #000, 0 -3px 0 #000, -3px 0 0 #000;
    }

    .size-ss .sub-line-ja { font-size: 1.4rem; }
    .size-ss .sub-line-kana { font-size: 1.0rem; }
    .size-ss .sub-line-text { font-size: 0.85rem; }

    .size-s .sub-line-ja { font-size: 1.8rem; }
    .size-s .sub-line-kana { font-size: 1.3rem; }
    .size-s .sub-line-text { font-size: 1.05rem; }

    .size-m .sub-line-ja { font-size: 2.2rem; }
    .size-m .sub-line-kana { font-size: 1.6rem; }
    .size-m .sub-line-text { font-size: 1.3rem; }

    .size-l .sub-line-ja { font-size: 2.7rem; }
    .size-l .sub-line-kana { font-size: 1.9rem; }
    .size-l .sub-line-text { font-size: 1.55rem; }

    .sub-line-ja { font-weight: bold; margin-bottom: 6px; }
    .sub-line-kana { color: #64b5f6; margin-bottom: 4px; }
    .sub-line-text { color: #dddddd; }

    #custom-panel {
      display: none;
      position: fixed;
      top: 0; right: 0;
      width: 480px; height: 100vh;
      background-color: rgba(20, 20, 20, 0.96);
      border-left: 2px solid #444;
      padding: 30px;
      z-index: 120;
      box-shadow: -10px 0 30px rgba(0,0,0,0.8);
      overflow-y: auto;
    }
    
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid #444;
      padding-bottom: 12px;
    }
    .panel-close-btn {
      background: #444;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }

    .panel-section { margin-bottom: 28px; }
    .panel-title { font-size: 1.1rem; color: #00d2ff; margin-bottom: 12px; }
    
    .size-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .panel-btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin-bottom: 8px;
      background: #333;
      border: 2px solid #555;
      color: #fff;
      border-radius: 8px;
      text-align: left;
      font-size: 1rem;
      cursor: pointer;
    }
    .size-grid .panel-btn {
      text-align: center;
      padding: 12px 0;
    }
    .panel-btn.active { border-color: #00d2ff; background: #005b82; font-weight: bold; }
  </style>
</head>
<body>

  <!-- メイン画面（検索・選択） -->
  <div id="app-container">
    <!-- 左サイドバー -->
    <div id="sidebar" class="sidebar">
      <div class="tag-section-title">タグ選択</div>
      <div id="tagContainer" class="tag-container"></div>

      <!-- 検索・クリアエリアをサイドバー最下部に移動 -->
      <div class="search-section">
        <input type="text" id="searchInput" class="search-input focusable" placeholder="キーワード検索..." />
        <button id="clearBtn" class="clear-btn focusable">✕ クリア</button>
      </div>
    </div>

    <!-- 右メインエリア (3列固定) -->
    <div class="main-content">
      <div id="videoGrid" class="video-grid"></div>
    </div>
  </div>

  <!-- 再生画面 (全画面シアター) -->
  <div id="player-view">
    <div id="youtube-player"></div>
    
    <button id="openPanelBtn" class="panel-trigger-btn focusable" onclick="toggleCustomPanel()">⚙ 字幕・表示設定</button>

    <div id="subtitle-overlay" class="style-standard size-m">
      <div id="subJa" class="sub-line-ja"></div>
      <div id="subKana" class="sub-line-kana"></div>
      <div id="subText" class="sub-line-text"></div>
    </div>

    <div id="custom-panel">
      <div class="panel-header">
        <h2 style="margin:0; font-size: 1.4rem;">字幕・表示設定</h2>
        <button class="panel-close-btn focusable" onclick="toggleCustomPanel()">閉じる ✕</button>
      </div>
      
      <div class="panel-section">
        <div class="panel-title">文字サイズ</div>
        <div class="size-grid">
          <button class="panel-btn focusable" onclick="setFontSize('size-ss', this)">SS</button>
          <button class="panel-btn focusable" onclick="setFontSize('size-s', this)">S</button>
          <button class="panel-btn focusable active" onclick="setFontSize('size-m', this)">M</button>
          <button class="panel-btn focusable" onclick="setFontSize('size-l', this)">L</button>
        </div>
      </div>

      <div class="panel-section">
        <div class="panel-title">表示プリセット</div>
        <button class="panel-btn focusable active" onclick="setPreset('ja-kana', this)">日本語 ＋ カタカナ（標準）</button>
        <button class="panel-btn focusable" onclick="setPreset('all', this)">全表示 (日本語/原文/カナ)</button>
        <button class="panel-btn focusable" onclick="setPreset('ja-only', this)">日本語のみ</button>
        <button class="panel-btn focusable" onclick="setPreset('text-kana', this)">原文 ＋ カタカナ</button>
      </div>

      <div class="panel-section">
        <div class="panel-title">スタイル・背景</div>
        <button class="panel-btn focusable active" onclick="setStyle('style-standard', this)">標準 (ダークシネマ)</button>
        <button class="panel-btn focusable" onclick="setStyle('style-high-contrast', this)">くっきり (高コントラスト黄色)</button>
        <button class="panel-btn focusable" onclick="setStyle('style-text-only', this)">文字のみ (ネオン縁取り)</button>
      </div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    let videoIndexData = [];
    let currentVideoDetail = null;
    let selectedTag = '#ALL';
    let ytPlayer = null;
    let subtitleTimer = null;
    
    let currentDisplayPreset = 'ja-kana';
    let currentStyleClass = 'style-standard';
    let currentSizeClass = 'size-m';

    window.addEventListener('DOMContentLoaded', async () => {
      await loadVideoIndex();
      setupEvents();
      setupSpatialNavigation();
    });

    async function loadVideoIndex() {
      try {
        const res = await fetch('videos.json');
        videoIndexData = await res.json();
        renderTags();
        renderVideos();
      } catch (err) {
        console.error('videos.json の読み込みに失敗しました:', err);
      }
    }

    function renderTags() {
      const tagContainer = document.getElementById('tagContainer');
      const tagsSet = new Set();
      
      videoIndexData.forEach(item => {
        if (item.keywords) {
          item.keywords.forEach(k => tagsSet.add(k));
        }
      });

      const sortedTags = Array.from(tagsSet).sort();
      const finalTags = ['#ALL', ...sortedTags.filter(t => t !== '#ALL')];

      tagContainer.innerHTML = '';
      finalTags.forEach(tag => {
        const btn = document.createElement('button');
        btn.className = `tag-btn focusable ${tag === selectedTag ? 'active' : ''}`;
        btn.innerText = tag;
        btn.onclick = () => filterByTag(tag);
        tagContainer.appendChild(btn);
      });
    }

    function renderVideos() {
      const grid = document.getElementById('videoGrid');
      const searchText = document.getElementById('searchInput').value.toLowerCase().trim();

      grid.innerHTML = '';

      const filtered = videoIndexData.filter(item => {
        const matchTag = (selectedTag === '#ALL') || (item.keywords && item.keywords.includes(selectedTag));
        const matchText = !searchText || item.title.toLowerCase().includes(searchText) || 
                          (item.keywords && item.keywords.some(k => k.toLowerCase().includes(searchText)));
        return matchTag && matchText;
      });

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'video-card focusable';
        card.onclick = () => playVideo(item);

        const thumbUrl = `https://img.youtube.com/vi/${item.id}/mqdefault.jpg`;
        const tagsHtml = (item.keywords || []).map(k => `<span class="card-tag">${k}</span>`).join('');

        card.innerHTML = `
          <div class="thumbnail-wrapper">
            <img class="thumbnail-img" src="${thumbUrl}" alt="${item.title}">
          </div>
          <div class="card-info">
            <h3 class="card-title">${item.title}</h3>
            <div class="card-tags">${tagsHtml}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function setupEvents() {
      const searchInput = document.getElementById('searchInput');

      searchInput.addEventListener('input', () => {
        renderVideos();
      });

      document.getElementById('clearBtn').onclick = () => {
        searchInput.value = '';
        selectedTag = '#ALL';
        renderTags();
        renderVideos();
        // クリア時もタグ先頭にフォーカスを戻す
        const firstTag = document.querySelector('.tag-btn');
        if (firstTag) firstTag.focus();
      };
    }

    function filterByTag(tag) {
      selectedTag = tag;
      document.getElementById('searchInput').value = '';
      renderTags();
      renderVideos();
    }

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('youtube-player', {
        playerVars: { 'autoplay': 1, 'controls': 1, 'rel': 0, 'modestbranding': 1 },
        events: { 'onStateChange': onPlayerStateChange }
      });
    }

    async function playVideo(item) {
      document.getElementById('app-container').style.display = 'none';
      document.getElementById('player-view').style.display = 'block';

      try {
        const res = await fetch(item.file);
        currentVideoDetail = await res.json();
      } catch (e) {
        currentVideoDetail = null;
      }

      if (ytPlayer && ytPlayer.loadVideoById) {
        ytPlayer.loadVideoById(item.id);
      }
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        startSubtitleSync();
      } else {
        stopSubtitleSync();
      }
    }

    function startSubtitleSync() {
      stopSubtitleSync();
      subtitleTimer = setInterval(updateSubtitle, 100);
    }

    function stopSubtitleSync() {
      if (subtitleTimer) clearInterval(subtitleTimer);
    }

    function updateSubtitle() {
      const overlay = document.getElementById('subtitle-overlay');

      if (!ytPlayer || !currentVideoDetail || !currentVideoDetail.transcript) {
        overlay.style.display = 'none';
        return;
      }
      
      const currentTime = ytPlayer.getCurrentTime();
      const currentSub = currentVideoDetail.transcript.find(t => currentTime >= t.start && currentTime <= t.end);

      const subJa = document.getElementById('subJa');
      const subKana = document.getElementById('subKana');
      const subText = document.getElementById('subText');

      if (currentSub && (currentSub.translation || currentSub.pronunciation_kana || currentSub.text)) {
        subJa.innerText = currentSub.translation || '';
        subKana.innerText = currentSub.pronunciation_kana || '';
        subText.innerText = currentSub.text || '';
        applyPresetVisibility();
        overlay.style.display = 'block';
      } else {
        subJa.innerText = '';
        subKana.innerText = '';
        subText.innerText = '';
        overlay.style.display = 'none';
      }
    }

    function toggleCustomPanel() {
      const panel = document.getElementById('custom-panel');
      if (panel.style.display === 'block') {
        panel.style.display = 'none';
      } else {
        panel.style.display = 'block';
        const firstBtn = panel.querySelector('.panel-btn');
        if (firstBtn) firstBtn.focus();
      }
    }

    function setFontSize(sizeClass, btnElement) {
      currentSizeClass = sizeClass;
      const overlay = document.getElementById('subtitle-overlay');
      overlay.classList.remove('size-ss', 'size-s', 'size-m', 'size-l');
      overlay.classList.add(sizeClass);

      const section = btnElement.closest('.panel-section');
      section.querySelectorAll('.panel-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
    }

    function setPreset(preset, btnElement) {
      currentDisplayPreset = preset;
      applyPresetVisibility();
      
      const section = btnElement.closest('.panel-section');
      section.querySelectorAll('.panel-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
    }

    function setStyle(styleClass, btnElement) {
      currentStyleClass = styleClass;
      const overlay = document.getElementById('subtitle-overlay');
      overlay.className = `${styleClass} ${currentSizeClass}`;
      
      const section = btnElement.closest('.panel-section');
      section.querySelectorAll('.panel-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
    }

    function applyPresetVisibility() {
      const subJa = document.getElementById('subJa');
      const subKana = document.getElementById('subKana');
      const subText = document.getElementById('subText');

      subJa.style.display = 'block';
      subKana.style.display = 'block';
      subText.style.display = 'block';

      if (currentDisplayPreset === 'ja-kana') {
        subText.style.display = 'none';
      } else if (currentDisplayPreset === 'ja-only') {
        subKana.style.display = 'none';
        subText.style.display = 'none';
      } else if (currentDisplayPreset === 'text-kana') {
        subJa.style.display = 'none';
      }
    }

    function exitPlayer() {
      if (ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
      stopSubtitleSync();
      document.getElementById('player-view').style.display = 'none';
      document.getElementById('custom-panel').style.display = 'none';
      document.getElementById('app-container').style.display = 'flex';
      
      const firstCard = document.querySelector('.video-card');
      if (firstCard) firstCard.focus();
    }

    // Spatial Navigation
    function setupSpatialNavigation() {
      // 初期フォーカスを「タグ一覧の先頭（#ALL）」に設定してキーボード起動を防止
      setTimeout(() => {
        const firstTag = document.querySelector('.tag-btn');
        if (firstTag) firstTag.focus();
      }, 500);

      document.addEventListener('keydown', (e) => {
        const key = e.key;
        const playerViewVisible = document.getElementById('player-view').style.display === 'block';
        const customPanelVisible = document.getElementById('custom-panel').style.display === 'block';

        if (playerViewVisible) {
          if (key === 'Escape' || key === 'Backspace' || e.keyCode === 10009 || e.keyCode === 461) {
            e.preventDefault();
            if (customPanelVisible) {
              document.getElementById('custom-panel').style.display = 'none';
            } else {
              exitPlayer();
            }
            return;
          }

          if (key === 'ArrowUp' && !customPanelVisible) {
            e.preventDefault();
            toggleCustomPanel();
            return;
          }
        }

        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(key)) {
          if (document.activeElement.id === 'searchInput' && ['ArrowLeft', 'ArrowRight'].includes(key)) {
            return;
          }
          
          e.preventDefault();
          moveFocus(key);
        }
      });
    }

    function moveFocus(direction) {
      const customPanelVisible = document.getElementById('custom-panel').style.display === 'block';
      let focusables = [];

      if (customPanelVisible) {
        focusables = Array.from(document.querySelectorAll('#custom-panel .focusable'));
      } else {
        focusables = Array.from(document.querySelectorAll('#app-container .focusable, #openPanelBtn'));
      }

      const current = document.activeElement;

      if (!focusables.includes(current)) {
        if (focusables.length > 0) focusables[0].focus();
        return;
      }

      const currentRect = current.getBoundingClientRect();
      let bestMatch = null;
      let minDistance = Infinity;

      focusables.forEach(el => {
        if (el === current) return;
        const rect = el.getBoundingClientRect();

        let isValidDirection = false;
        if (direction === 'ArrowUp') isValidDirection = rect.bottom <= currentRect.top + 10;
        if (direction === 'ArrowDown') isValidDirection = rect.top >= currentRect.bottom - 10;
        if (direction === 'ArrowLeft') isValidDirection = rect.right <= currentRect.left + 10;
        if (direction === 'ArrowRight') isValidDirection = rect.left >= currentRect.right - 10;

        if (isValidDirection) {
          const dist = Math.hypot(
            (rect.left + rect.width / 2) - (currentRect.left + currentRect.width / 2),
            (rect.top + rect.height / 2) - (currentRect.top + currentRect.height / 2)
          );
          if (dist < minDistance) {
            minDistance = dist;
            bestMatch = el;
          }
        }
      });

      if (bestMatch) {
        bestMatch.focus();
      }
    }
  </script>
</body>
</html>
