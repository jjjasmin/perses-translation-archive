<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    body { background: #111; color: #fff; font-size: 24px; padding: 50px; }
    .btn { padding: 20px; margin: 10px; background: #333; display: inline-block; }
    .btn:focus { outline: 5px solid #00d2ff; background: #005b82; }
  </style>
</head>
<body>
  <h2>Fire TV Silk リモコンテスト</h2>
  <div class="btn" tabindex="0">ボタン 1</div>
  <div class="btn" tabindex="0">ボタン 2</div>
  <div class="btn" tabindex="0">ボタン 3</div>

  <script>
    // キャプチャフェーズ(true)でキーを監視
    window.addEventListener('keydown', (e) => {
      console.log('押されたキー:', e.key, e.keyCode);
    }, true);

    // 画面クリック/決定で最初の要素にフォーカス
    window.onload = () => {
      document.querySelector('.btn').focus();
    };
  </script>
</body>
</html>
