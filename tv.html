<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PERSES TV Player</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    
    /* TVブラウザの自動テキスト拡大を完全停止 */
    html, body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-size: 10px; /* デフォルト（TV・Silk向け） */
      -webkit-text-size-adjust: none !important;
      -moz-text-size-adjust: none !important;
      -ms-text-size-adjust: none !important;
      text-size-adjust: none !important;
    }

    /* PC環境判定（マウス操作・広画面）：20pxへ上書き */
    @media (hover: hover) and (pointer: fine) and (min-width: 960px) {
      html, body {
        font-size: 20px;
      }
    }

    /* --------------------------------------------------
       フォーカス表示 (Spatial Navigation)
    -------------------------------------------------- */
    .focusable {
      outline: none;
      transition: outline 0.15s ease-in-out, transform 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
    }
    .focusable:focus {
      outline: 4px solid #00d2ff !important;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.9) !important;
      transform: scale(1.02);
      z-index: 10;
    }

    /* --------------------------------------------------
       メインUI (2カラムレイアウト)
    -------------------------------------------------- */
    #app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    /* ■ 左サイドバー */
    .sidebar {
      width: 20vw;
      min-width: 20vw;
      height: 100vh;
      background-color: #1a1a1a;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      border-right: 2px solid #333;
    }

    .tag-section-title {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .tag-container {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      margin-bottom: 1rem;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .tag-container::-webkit-scrollbar {
      display: none;
    }

    .tag-btn {
      width: 100%;
      padding: 0.8rem 1rem;
      background-color: #2a2a2a;
      border: 2px solid #444;
      color: #ddd;
      border-radius: 8px;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
    }
    .tag-btn.active {
      background-color: #00d2ff;
      color: #000;
      font-weight: bold;
      border-color: #00d2ff;
    }

    .search-section {
      border-top: 1px solid #333;
      padding-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .search-input {
      width: 100%;
      height: 2.6rem;
      padding: 0 0.8rem;
      font-size: 1rem;
      border-radius: 8px;
      border: 2px solid #444;
      background-color: #2a2a2a;
      color: #fff;
    }

    .clear-btn {
      width: 100%;
      height: 2.6rem;
      font-size: 1rem;
      background-color: #333;
      border: 2px solid #555;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
    }

    /* ■ 右メインエリア */
    .main-content {
      width: 80vw;
      height: 100vh;
      padding: 1.5rem;
      overflow-y: auto;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.2rem;
      padding-bottom: 3rem;
    }

    .video-card {
      background-color: #222;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid #333;
    }

    .thumbnail-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background-color: #000;
    }
    .thumbnail-img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .card-info {
      padding: 1rem;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.35;
      margin: 0 0 0.6rem 0;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      height: 4.05em;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .card-tag {
      font-size: 0.8rem;
      color: #aaa;
      background: #333;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* --------------------------------------------------
       再生画面 (全画面シアターモード)
    -------------------------------------------------- */
    #player-view {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-color: #000;
      z-index: 100;
    }
    #youtube-player {
      width: 100vw;
      height: 100vh;
    }

    /* 「字幕設定」ボタン */
    .panel-trigger-btn {
      position: absolute;
      top: 0rem;
      right: 0rem;
      z-index: 115;
      cursor: pointer;
    }

    /* 「選択画面に戻る」ボタン（右下ホバー時のみ表示） */
    .back-to-select-btn {
      position: absolute;
      bottom: 4rem;
      right: 25px;
      z-index: 118;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      border: 1px solid #777;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: auto;
    }
    /* ボタン自身にフォーカスがある時に表示 */
    .back-to-select-btn:focus {
      opacity: 1;
    }

    #subtitle-overlay {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      text-align: center;
      padding: 1rem 1.5rem;
      border-radius: 16px;
      transition: all 0.2s ease;
      z-index: 110;
      pointer-events: none;
      display: none;
    }

    .style-standard {
      background-color: rgba(0, 0, 0, 0.8);
      color: #ffffff;
    }
    .style-high-contrast {
      background-color: #000000;
      color: #ffeb3b;
      font-weight: bold;
    }
    
    /* シンプルな黒縁取り */
    .style-text-only {
      background-color: transparent;
      color: #ffffff;
      text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 2px 0 #000, 2px 0 0 #000, 0 -2px 0 #000, -2px 0 0 #000;
    }

    /* 字幕サイズ (SS / S / M / L / LL) */
    .size-ss .sub-line-ja { font-size: 1.0rem; }
    .size-ss .sub-line-kana { font-size: 0.75rem; }
    .size-ss .sub-line-text { font-size: 0.65rem; }

    .size-s .sub-line-ja { font-size: 1.4rem; }
    .size-s .sub-line-kana { font-size: 1.0rem; }
    .size-s .sub-line-text { font-size: 0.85rem; }

    .size-m .sub-line-ja { font-size: 1.8rem; }
    .size-m .sub-line-kana { font-size: 1.3rem; }
    .size-m .sub-line-text { font-size: 1.05rem; }

    .size-l .sub-line-ja { font-size: 2.2rem; }
    .size-l .sub-line-kana { font-size: 1.6rem; }
    .size-l .sub-line-text { font-size: 1.3rem; }

    .size-ll .sub-line-ja { font-size: 2.7rem; }
    .size-ll .sub-line-kana { font-size: 1.9rem; }
    .size-ll .sub-line-text { font-size: 1.55rem; }

    .sub-line-ja { font-weight: bold; margin-bottom: 0.3rem; }
    .sub-line-kana { color: #64b5f6; margin-bottom: 0.2rem; }
    .sub-line-text { color: #dddddd; }

    #custom-panel {
      display: none;
      position: fixed;
      top: 0; right: 0;
      width: 25vw; min-width: 320px;
      height: 100vh;
      background-color: rgba(20, 20, 20, 0.96);
      border-left: 2px solid #444;
      padding: 1.5rem;
      z-index: 120;
      box-shadow: -10px 0 30px rgba(0,0,0,0.8);
      overflow-y: auto;
    }
    
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid #444;
      padding-bottom: 0.8rem;
    }
    .panel-close-btn {
      background: #444;
      color: #fff;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }

    .panel-section { margin-bottom: 1.5rem; }
    .panel-title { font-size: 1.1rem; color: #00d2ff; margin-bottom: 0.8rem; }
    
    .size-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.3rem;
    }

    .panel-btn {
      display: block;
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 0.5rem;
      background: #333;
      border: 2px solid #555;
      color: #fff;
      border-radius: 8px;
      text-align: left;
      font-size: 1rem;
      cursor: pointer;
    }
    .size-grid .panel-btn {
      text-align: center;
      padding: 0.6rem 0;
    }
    .panel-btn.active { border-color: #00d2ff; background: #005b82; font-weight: bold; }
  </style>
</head>
<body>

  <!-- メイン画面（検索・選択） -->
  <div id="app-container">
    <div id="sidebar" class="sidebar">
      <div class="tag-section-title">タグ選択</div>
      <div id="tagContainer" class="tag-container"></div>

      <div class="search-section">
        <input type="text" id="searchInput" class="search-input focusable" placeholder="キーワード検索..." />
        <button id="clearBtn" class="clear-btn focusable">✕ クリア</button>
      </div>
    </div>

    <div class="main-content">
      <div id="videoGrid" class="video-grid"></div>
    </div>
  </div>

  <!-- 再生画面 (全画面シアター) -->
  <div id="player-view">
    <div id="youtube-player"></div>
    
    <!-- 字幕設定ボタン -->
    <p id="openPanelBtn" class="panel-trigger-btn focusable" onclick="toggleCustomPanel()">🐈</p>

    <!-- 右下「選択画面に戻る」ボタン (ホバー表示) -->
    <button id="backToSelectBtn" class="back-to-select-btn focusable" onclick="exitPlayer()">選択画面に戻る</button>

    <div id="subtitle-overlay" class="style-standard size-m">
      <div id="subJa" class="sub-line-ja"></div>
      <div id="subKana" class="sub-line-kana"></div>
      <div id="subText" class="sub-line-text"></div>
    </div>

    <div id="custom-panel">
      <div class="panel-header">
        <h2 style="margin:0; font-size: 1.3rem;">字幕・表示設定</h2>
        <button class="panel-close-btn focusable" onclick="toggleCustomPanel()">閉じる ✕</button>
      </div>
      
      <!-- 5段階サイズ（SS / S / M / L / LL）デフォルト：M -->
      <div class="panel-section">
        <div class="panel-title">文字サイズ</div>
        <div class="size-grid">
          <button class="panel-btn focusable" onclick="setFontSize('size-ss', this)">SS</button>
          <button class="panel-btn focusable" onclick="setFontSize('size-s', this)">S</button>
          <button class="panel-btn focusable active" onclick="setFontSize('size-m', this)">M</button>
          <button class="panel-btn focusable" onclick="setFontSize('size-l', this)">L</button>
          <button class="panel-btn focusable" onclick="setFontSize('size-ll', this)">LL</button>
        </div>
      </div>

      <div class="panel-section">
        <div class="panel-title">表示プリセット</div>
        <button class="panel-btn focusable active" onclick="setPreset('ja-kana', this)">日本語 ＋ カタカナ（標準）</button>
        <button class="panel-btn focusable" onclick="setPreset('all', this)">全表示 (日本語/原文/カナ)</button>
        <button class="panel-btn focusable" onclick="setPreset('ja-only', this)">日本語のみ</button>
        <button class="panel-btn focusable" onclick="setPreset('text-kana', this)">原文 ＋ カタカナ</button>
      </div>

      <div class="panel-section">
        <div class="panel-title">スタイル・背景</div>
        <button class="panel-btn focusable active" onclick="setStyle('style-standard', this)">標準 (ダークシネマ)</button>
        <button class="panel-btn focusable" onclick="setStyle('style-high-contrast', this)">くっきり (高コントラスト黄色)</button>
        <button class="panel-btn focusable" onclick="setStyle('style-text-only', this)">文字のみ (シンプル縁取り)</button>
      </div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    let videoIndexData = [];
    let tagsDataGlobal = {};
    let currentVideoDetail = null;
    let selectedTag = '#ALL';
    let ytPlayer = null;
    let subtitleTimer = null;
    
    let currentDisplayPreset = 'ja-kana';
    let currentStyleClass = 'style-standard';
    let currentSizeClass = 'size-m';

    window.addEventListener('DOMContentLoaded', async () => {
      setupHistoryState();
      await loadVideoIndex();
      setupEvents();
      setupSpatialNavigation();
    });

    function setupHistoryState() {
      history.pushState({ page: 'main' }, '', location.href);
      
      window.addEventListener('popstate', (e) => {
        const playerViewVisible = document.getElementById('player-view').style.display === 'block';
        const customPanelVisible = document.getElementById('custom-panel').style.display === 'block';

        if (customPanelVisible) {
          history.pushState({ page: 'player' }, '', location.href);
          document.getElementById('custom-panel').style.display = 'none';
        } else if (playerViewVisible) {
          history.pushState({ page: 'main' }, '', location.href);
          exitPlayer();
        } else {
          history.pushState({ page: 'main' }, '', location.href);
        }
      });
    }

    async function loadVideoIndex() {
            try {
              const [tagsRes, videosRes] = await Promise.all([
                fetch('data/tags.json'),
                fetch('data/videos.json')
              ]);
              
              tagsDataGlobal = tagsRes.ok ? await tagsRes.json() : {};
              const videoList = videosRes.ok ? await videosRes.json() : [];

              // ★ 追加: published_at の降順（新しい順）にソート
              videoList.sort((a, b) => {
                const dateA = a.published_at || '';
                const dateB = b.published_at || '';
                return dateB.localeCompare(dateA); // 降順比較
              });

              videoIndexData = videoList;

              renderTags();
              renderVideos();
            } catch (err) {
              console.error('データの読み込みに失敗しました:', err);
            }
          }

      function renderTags() {
        const tagContainer = document.getElementById('tagContainer');
        tagContainer.innerHTML = '';

        // まず #ALL ボタンを配置
        const allBtn = document.createElement('button');
        allBtn.className = `tag-btn focusable ${selectedTag === '#ALL' ? 'active' : ''}`;
        allBtn.innerText = '#ALL';
        allBtn.onclick = () => filterByTag('#ALL');
        tagContainer.appendChild(allBtn);

        // カテゴリごとに見出しとボタンを出力
        for (const [categoryName, categoryTags] of Object.entries(tagsDataGlobal)) {
          const titleEl = document.createElement('div');
          titleEl.className = 'tag-category-title';
          titleEl.style.cssText = 'font-size: 0.75rem; color: #00d2ff; margin-top: 1rem; font-weight: bold; text-transform: uppercase;';
          titleEl.innerText = categoryName;
          tagContainer.appendChild(titleEl);

          for (const tagKey of Object.keys(categoryTags)) {
            const btn = document.createElement('button');
            btn.className = `tag-btn focusable ${tagKey === selectedTag ? 'active' : ''}`;
            btn.innerText = tagKey;
            btn.onclick = () => filterByTag(tagKey);
            tagContainer.appendChild(btn);
          }
        }
      }

    function renderVideos() {
      const grid = document.getElementById('videoGrid');
      const searchText = document.getElementById('searchInput').value.toLowerCase().trim();

      grid.innerHTML = '';

      const filtered = videoIndexData.filter(item => {
        const matchTag = (selectedTag === '#ALL') || (item.keywords && item.keywords.includes(selectedTag));
        const matchText = !searchText || item.title.toLowerCase().includes(searchText) || 
                          (item.keywords && item.keywords.some(k => k.toLowerCase().includes(searchText)));
        return matchTag && matchText;
      });

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'video-card focusable';
        card.tabIndex = 0; // PCキーボード用フォーカス有効化
        card.onclick = () => playVideo(item);

        const thumbUrl = `https://img.youtube.com/vi/${item.id}/mqdefault.jpg`;
        const tagsHtml = (item.keywords || []).map(k => `<span class="card-tag">${k}</span>`).join('');

        card.innerHTML = `
          <div class="thumbnail-wrapper">
            <img class="thumbnail-img" src="${thumbUrl}" alt="${item.title}">
          </div>
          <div class="card-info">
            <h3 class="card-title">${item.title}</h3>
            <!--<div class="card-tags">${tagsHtml}</div>-->
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function setupEvents() {
      const searchInput = document.getElementById('searchInput');

      searchInput.addEventListener('input', () => {
        renderVideos();
      });

      document.getElementById('clearBtn').onclick = () => {
        searchInput.value = '';
        selectedTag = '#ALL';
        renderTags();
        renderVideos();
        const firstTag = document.querySelector('.tag-btn');
        if (firstTag) firstTag.focus();
      };
    }

    function filterByTag(tag) {
      selectedTag = tag;
      document.getElementById('searchInput').value = '';
      renderTags();
      renderVideos();
    }

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('youtube-player', {
        playerVars: { 'autoplay': 1, 'controls': 1, 'rel': 0, 'modestbranding': 1 },
        events: { 'onStateChange': onPlayerStateChange }
      });
    }

    async function playVideo(item) {
      document.getElementById('app-container').style.display = 'none';
      document.getElementById('player-view').style.display = 'block';
      history.pushState({ page: 'player' }, '', location.href);

      try {
          // 変更前: fetch(item.file)
          const res = await fetch(`data/transcripts/${item.file}`);
          currentVideoDetail = await res.json();
        } catch (e) {
          currentVideoDetail = null;
        }

      if (ytPlayer && ytPlayer.loadVideoById) {
        ytPlayer.loadVideoById(item.id);
      }
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        startSubtitleSync();
      } else {
        stopSubtitleSync();
      }
    }

    function startSubtitleSync() {
      stopSubtitleSync();
      subtitleTimer = setInterval(updateSubtitle, 100);
    }

    function stopSubtitleSync() {
      if (subtitleTimer) clearInterval(subtitleTimer);
    }

    function updateSubtitle() {
      const overlay = document.getElementById('subtitle-overlay');

      if (!ytPlayer || !currentVideoDetail || !currentVideoDetail.transcript) {
        overlay.style.display = 'none';
        return;
      }
      
      const currentTime = ytPlayer.getCurrentTime();
      const currentSub = currentVideoDetail.transcript.find(t => currentTime >= t.start && currentTime <= t.end);

      const subJa = document.getElementById('subJa');
      const subKana = document.getElementById('subKana');
      const subText = document.getElementById('subText');

      if (currentSub && (currentSub.translation || currentSub.pronunciation_kana || currentSub.text)) {
        subJa.innerText = currentSub.translation || '';
        subKana.innerText = currentSub.pronunciation_kana || '';
        subText.innerText = currentSub.text || '';
        applyPresetVisibility();
        overlay.style.display = 'block';
      } else {
        subJa.innerText = '';
        subKana.innerText = '';
        subText.innerText = '';
        overlay.style.display = 'none';
      }
    }

    function toggleCustomPanel() {
      const panel = document.getElementById('custom-panel');
      if (panel.style.display === 'block') {
        panel.style.display = 'none';
      } else {
        panel.style.display = 'block';
        const firstBtn = panel.querySelector('.panel-btn');
        if (firstBtn) firstBtn.focus();
      }
    }

    function setFontSize(sizeClass, btnElement) {
      currentSizeClass = sizeClass;
      const overlay = document.getElementById('subtitle-overlay');
      overlay.classList.remove('size-ss', 'size-s', 'size-m', 'size-l', 'size-ll');
      overlay.classList.add(sizeClass);

      const section = btnElement.closest('.panel-section');
      section.querySelectorAll('.panel-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
    }

    function setPreset(preset, btnElement) {
      currentDisplayPreset = preset;
      applyPresetVisibility();
      
      const section = btnElement.closest('.panel-section');
      section.querySelectorAll('.panel-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
    }

    function setStyle(styleClass, btnElement) {
      currentStyleClass = styleClass;
      const overlay = document.getElementById('subtitle-overlay');
      overlay.className = `${styleClass} ${currentSizeClass}`;
      
      const section = btnElement.closest('.panel-section');
      section.querySelectorAll('.panel-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
    }

    function applyPresetVisibility() {
      const subJa = document.getElementById('subJa');
      const subKana = document.getElementById('subKana');
      const subText = document.getElementById('subText');

      subJa.style.display = 'block';
      subKana.style.display = 'block';
      subText.style.display = 'block';

      if (currentDisplayPreset === 'ja-kana') {
        subText.style.display = 'none';
      } else if (currentDisplayPreset === 'ja-only') {
        subKana.style.display = 'none';
        subText.style.display = 'none';
      } else if (currentDisplayPreset === 'text-kana') {
        subJa.style.display = 'none';
      }
    }

    function exitPlayer() {
      if (ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
      stopSubtitleSync();
      document.getElementById('player-view').style.display = 'none';
      document.getElementById('custom-panel').style.display = 'none';
      document.getElementById('app-container').style.display = 'flex';
      
      const firstCard = document.querySelector('.video-card');
      if (firstCard) firstCard.focus();
    }

    function setupSpatialNavigation() {
      setTimeout(() => {
        const firstTag = document.querySelector('.tag-btn');
        if (firstTag) firstTag.focus();
      }, 500);

      document.addEventListener('keydown', (e) => {
        const key = e.key;
        const code = e.keyCode || e.which;
        const playerViewVisible = document.getElementById('player-view').style.display === 'block';
        const customPanelVisible = document.getElementById('custom-panel').style.display === 'block';

        // PCキーボード再生操作（動画選択画面でEnter押下時）
        if (!playerViewVisible && key === 'Enter') {
          if (document.activeElement && document.activeElement.classList.contains('video-card')) {
            e.preventDefault();
            document.activeElement.click();
            return;
          }
        }

        if (playerViewVisible) {
          if (key === 'Escape' || key === 'Backspace' || code === 10009 || code === 461 || code === 27) {
            e.preventDefault();
            if (customPanelVisible) {
              document.getElementById('custom-panel').style.display = 'none';
            } else {
              exitPlayer();
            }
            return;
          }

          if (key === 'MediaPlayPause' || code === 179 || code === 32 || key === ' ') {
            e.preventDefault();
            if (ytPlayer && typeof ytPlayer.getPlayerState === 'function') {
              const state = ytPlayer.getPlayerState();
              if (state === YT.PlayerState.PLAYING) {
                ytPlayer.pauseVideo();
              } else {
                ytPlayer.playVideo();
              }
            }
            return;
          }

          if (key === 'MediaFastForward' || code === 228 || (key === 'ArrowRight' && !customPanelVisible)) {
            if (document.activeElement !== document.getElementById('openPanelBtn') && document.activeElement !== document.getElementById('backToSelectBtn')) {
              e.preventDefault();
              if (ytPlayer && typeof ytPlayer.getCurrentTime === 'function') {
                ytPlayer.seekTo(ytPlayer.getCurrentTime() + 10, true);
              }
              return;
            }
          }
          if (key === 'MediaRewind' || code === 227 || (key === 'ArrowLeft' && !customPanelVisible)) {
            if (document.activeElement !== document.getElementById('openPanelBtn') && document.activeElement !== document.getElementById('backToSelectBtn')) {
              e.preventDefault();
              if (ytPlayer && typeof ytPlayer.getCurrentTime === 'function') {
                ytPlayer.seekTo(Math.max(0, ytPlayer.getCurrentTime() - 10), true);
              }
              return;
            }
          }

          if (key === 'ArrowUp' && !customPanelVisible) {
            e.preventDefault();
            toggleCustomPanel();
            return;
          }
        }

        // 矢印キー移動処理（左右コンテンツ間のナビゲーション拡張）
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(key)) {
          if (document.activeElement.id === 'searchInput' && ['ArrowLeft', 'ArrowRight'].includes(key)) {
            return;
          }
          
          e.preventDefault();
          moveFocus(key);
        }
      });
    }

    function moveFocus(direction) {
      const customPanelVisible = document.getElementById('custom-panel').style.display === 'block';
      let focusables = [];

      if (customPanelVisible) {
        focusables = Array.from(document.querySelectorAll('#custom-panel .focusable'));
      } else {
        focusables = Array.from(document.querySelectorAll('#app-container .focusable, #openPanelBtn, #backToSelectBtn'));
      }

      const current = document.activeElement;

      if (!focusables.includes(current)) {
        if (focusables.length > 0) focusables[0].focus();
        return;
      }

      const currentRect = current.getBoundingClientRect();
      let bestMatch = null;
      let minDistance = Infinity;

      focusables.forEach(el => {
        if (el === current) return;
        const rect = el.getBoundingClientRect();

        let isValidDirection = false;
        if (direction === 'ArrowUp') isValidDirection = rect.bottom <= currentRect.top + 15;
        if (direction === 'ArrowDown') isValidDirection = rect.top >= currentRect.bottom - 15;
        if (direction === 'ArrowLeft') isValidDirection = rect.right <= currentRect.left + 15;
        if (direction === 'ArrowRight') isValidDirection = rect.left >= currentRect.right - 15;

        if (isValidDirection) {
          const dist = Math.hypot(
            (rect.left + rect.width / 2) - (currentRect.left + currentRect.width / 2),
            (rect.top + rect.height / 2) - (currentRect.top + currentRect.height / 2)
          );
          if (dist < minDistance) {
            minDistance = dist;
            bestMatch = el;
          }
        }
      });

      if (bestMatch) {
        bestMatch.focus();
      }
    }
  </script>
