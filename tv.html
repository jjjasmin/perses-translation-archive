<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Silk D-Pad テスト</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: sans-serif;
      padding: 40px;
      text-align: center;
      cursor: none !important; /* マウスカーソル非表示 */
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .log {
      font-size: 18px;
      color: #00d2ff;
      margin-bottom: 30px;
      min-height: 1.5em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 160px);
      gap: 20px;
      justify-content: center;
    }

    button {
      padding: 20px;
      font-size: 18px;
      background-color: #222;
      color: white;
      border: 2px solid #444;
      border-radius: 8px;
      outline: none;
    }

    /* D-Padフォーカス時のハイライト */
    button:focus {
      outline: 4px solid #00d2ff !important;
      background-color: #005b82;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <h1>Silk D-Pad 動作確認</h1>
  <div id="log" class="log">リモコンの矢印キーを押してください</div>

  <div class="grid">
    <button autofocus onclick="logAction('ボタン 1')">ボタン 1</button>
    <button onclick="logAction('ボタン 2')">ボタン 2</button>
    <button onclick="logAction('button 3')">ボタン 3</button>
    <button onclick="logAction('ボタン 4')">ボタン 4</button>
  </div>

  <script>
    const logEl = document.getElementById('log');

    function logAction(name) {
      logEl.innerText = `${name} が決定されました！`;
    }

    // 押されたキーの名称とコードを表示
    window.addEventListener('keydown', (e) => {
      logEl.innerText = `Key: ${e.key} | Code: ${e.keyCode || e.which}`;
    }, true);

    // 読み込み直後に最初のボタンにフォーカスを当てる
    window.onload = () => {
      const firstBtn = document.querySelector('button');
      if (firstBtn) firstBtn.focus();
    };
  </script>
</body>
</html>
